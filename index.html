/* ==========================================================================
   Stress screen: how hard your nervous system is working, on a 0 to 3 scale.
   ========================================================================== */

/* A 240 degree gauge from blue (calm) through green to orange (high stress).
   It is drawn as 72 short arcs, each a slightly different color. */
function stressGaugeSVG(v){
  const cx = 120, cy = 118, r = 100, a0 = 150, sweep = 240, n = 72;
  const P = deg => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const mix = (a, b, f) => a.map((x, i) => Math.round(x + (b[i] - x) * f));
  const stops = [[111, 178, 242], [69, 227, 180], [255, 162, 74]];
  const col = f => { const c = f < .5 ? mix(stops[0], stops[1], f * 2) : mix(stops[1], stops[2], (f - .5) * 2); return `rgb(${c.join(',')})`; };
  const fv = fin(v) ? clamp(v / 3, 0, 1) : 0;
  let s = `<svg viewBox="0 0 240 200" aria-hidden="true">`;
  for (let k = 0; k < n; k++){
    const f0 = k / n, f1 = (k + 1.15) / n, [x0, y0] = P(a0 + sweep * f0), [x1, y1] = P(a0 + sweep * Math.min(1, f1));
    s += `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${col(f0)}" stroke-width="9" opacity="${fin(v) && f0 <= fv ? 1 : .28}"/>`;
  }
  if (fin(v)){
    const ang = (a0 + sweep * fv) * Math.PI / 180, r1 = r - 18, r2 = r + 6;
    s += `<line x1="${(cx + r1 * Math.cos(ang)).toFixed(2)}" y1="${(cy + r1 * Math.sin(ang)).toFixed(2)}" x2="${(cx + r2 * Math.cos(ang)).toFixed(2)}" y2="${(cy + r2 * Math.sin(ang)).toFixed(2)}" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  }
  return s + '</svg>';
}

/* One or two sentences: the level you spent the most time in, and your longest high stretch. */
function stressInsight(d, st){
  const tot = st.mins[0] + st.mins[1] + st.mins[2];
  if (!tot) return 'No stress readings yet. Stress is measured while you are awake and still.';
  const names = ['low', 'medium', 'high'], top = st.mins.indexOf(Math.max(...st.mins));
  let best = null, cur = null;
  st.series.forEach(([m, v]) => {
    if (v != null && v >= 2){ if (!cur) cur = {s:m, e:m}; else cur.e = m; }
    else if (cur){ if (!best || cur.e - cur.s > best.e - best.s) best = cur; cur = null; }
  });
  if (cur && (!best || cur.e - cur.s > best.e - best.s)) best = cur;
  const high = best && best.e - best.s >= 10 ? ` Your longest period of high stress started at ${clock(best.s)} and lasted ${Math.round(best.e - best.s)} minutes.` : ' You had no long stretches of high stress.';
  return `Most of your time was spent in the ${names[top]} stress zone.${high}`;
}

/* The gauge at the top of the screen. */
function stressHero(d){
  const st = stressOf(d), v = d.isToday && st.now != null ? st.now : st.avg, lv = stressLevel(v);
  return `<section class="hero2" aria-label="Stress ${fNum(v, 1)}, ${lv.label}">
    <div class="sgauge">${stressGaugeSVG(v)}<div class="sg-c"><b>${fNum(v, 1)}</b><span class="lv" style="color:${lv.c}">${fin(v) ? lv.label : 'No data'}</span><span>${d.isToday ? `Last updated ${clock(NOW_MIN)}` : 'Day average'}</span></div></div>

}

/* ==========================================================================
   Health screen: five vital signs measured while you sleep,

/* One vital sign with a bar showing your normal range and where tonight landed. */
function hmRow(key){
  const m = M[key], v = m.get(days[sel]), b = baseline(key, sel);
  if (!fin(v)) return '';
  const within = v >= b.lo && v <= b.hi;
  const lo = b.mean - b.tol * 2.2, hi = b.mean + b.tol * 2.2, P = x => clamp((x - lo) / (hi - lo) * 100, 0, 100);
  return `<button class="hm-row" data-metric="${key}">
    <span class="hm-top"><span class="hm-name">${m.name}</span><span class="hm-val">${fmtM(key, v)}<small>${m.unit}</small></span></span>

    <span class="hm-foot"><span>${b.cal ? 'Needs a few nights to learn your range' : `Typical ${fmtM(key, b.lo)} to ${fmtM(key, b.hi)}${unitSuffix(m)}`}</span>${b.cal ? chip('var(--text-2)', IC.flat, 'Learning') : within ? chip('var(--mint)', IC.check, 'Within range') : chip('var(--bad)', IC.alert, 'Outside range')}</span>

}

/* ==========================================================================
   Trends screen: one measurement over a week, a month or three months.
   ========================================================================== */

/* The measurements you can pick on this screen. */
const TREND_KEYS = ['recovery', 'hrv', 'rhr', 'sleepHrs', 'strain', 'stress', 'calories', 'steps', 'vo2'];

/* Builds the whole Trends screen: the big chart, its numbers, strain vs recovery, and this week vs last. */
function renderTrends(){
  const m = M[trend.key], key = trend.key, r = trend.range;
  const cur = lastN(sel, r), prev = days.slice(Math.max(0, sel - 2 * r + 1), sel - r + 1);
  const vals = cur.map(m.get), fv = vals.filter(fin), avg = fmean(vals), pAvg = fmean(prev.map(m.get));
  const cmp = compare(key, avg, pAvg);
  const hiIdx = fv.length ? vals.indexOf(Math.max(...fv)) : -1, loIdx = fv.length ? vals.indexOf(Math.min(...fv)) : -1;
  const curF = cur.filter(d => fin(m.get(d)));
  const rangeName = {7:'week', 30:'30 days', 90:'90 days'}[r];
  let chart;
  if (r === 90){
    const weeks = []; for (let j = 12; j >= 0; j--){ const a = sel - 7 * j - 6, b = sel - 7 * j + 1; if (b > 0) weeks.push(days.slice(Math.max(0, a), b)); }
    const data = weeks.map(wk => { const v = fmean(wk.map(m.get)); return {v, label:fMD(wk[0].date), wk}; });
    const lineData = data.filter(x => fin(x.v));
    if (m.kind === 'line'){
      chart = !lineData.length ? noData('No readings yet.') : lineChart({label:`${m.name}, weekly average`, data:lineData, color:'var(--vital)', signed:m.signed, every:4, fmt:v => fmtM(key, v), tip:i => `<b>Week of ${lineData[i].label}</b>Avg ${fmtM(key, lineData[i].v)}${unitSuffix(m)}`, h:200});
    } else {
      const auto = m.max ? null : niceTicks(0, Math.max(1, ...data.map(x => x.v || 0)), 3);
      chart = colChart({label:`${m.name}, weekly average`, data:data.map(x => ({...x, v:x.v || 0, color:m.color(x.v), mk:m.marker ? mean(x.wk.map(m.marker)) : null})), max:m.max || auto[auto.length - 1], ticks:m.ticks || auto, tickFmt:m.tickFmt, every:4, sel:data.length - 1, h:200,
        valFmt:v => fmtM(key, v) + (m.unit === '%' ? '%' : ''), tip:i => `<b>Week of ${data[i].label}</b>Avg ${fmtM(key, data[i].v)}${unitSuffix(m)}`});
    }
  } else if (m.kind === 'line'){
    chart = !curF.length ? noData('No readings yet.') : lineChart({label:`${m.name}, last ${r} days`, data:curF.map(d => ({v:m.get(d), label:r <= 10 ? DOW[d.dow] : fMD(d.date)})), color:'var(--vital)', signed:m.signed, fmt:v => fmtM(key, v), tip:i => `<b>${fDate(curF[i].date)}</b>${fmtM(key, m.get(curF[i]))}${unitSuffix(m)}`, h:200});
  } else chart = dailyCols(key, r, 200);

  const pairs = lastN(sel, 90).filter(d => d.i > 0 && fin(d.rec)).map(d => ({x:days[d.i - 1].strain, y:d.rec, d}));
  const hard = pairs.filter(p => p.x >= 16), easy = pairs.filter(p => p.x < 10);
  const hardDiff = Math.round(mean(easy.map(p => p.y)) - mean(hard.map(p => p.y)));
  const thisWk = lastN(sel, 7), lastWk = days.slice(Math.max(0, sel - 13), Math.max(0, sel - 6));
  const weekly = ['recovery', 'hrv', 'sleepHrs', 'strain'].map(k => {
    const a = fmean(thisWk.map(M[k].get)), b = fmean(lastWk.map(M[k].get)), c = compare(k, a, b);
    return `<li><span>${M[k].name}</span><b>${fmtM(k, a)}${unitSuffix(M[k])} <span class="delta ${c.tone}">${IC[c.dir]}${c.txt}</span></b></li>`;
  }).join('');

  return `
  <article class="card t-controls">
    <div class="chips" role="group" aria-label="Metric">${TREND_KEYS.map(k => `<button class="chip-btn" data-tk="${k}" aria-pressed="${k === key}">${M[k].short || M[k].name}</button>`).join('')}</div>
    <div class="row"><span class="card-note">Showing ${m.name.toLowerCase()} for the last ${rangeName}${r === 90 ? ', by week' : ''}</span>${segBtns('tr', r, [[7, '1W'], [30, '1M'], [90, '3M']])}</div>
  </article>

  <article class="card">
    <div class="card-h"><h2 class="card-t">${m.name}</h2>${m.kind === 'col' && key === 'recovery' ? zoneLegend : key === 'sleepHrs' ? '<span class="legend"><span class="key"><span class="sw" style="background:var(--sleep)"></span>Slept</span><span class="key"><span class="sw-line"></span>Needed</span></span>' : ''}</div>
    ${slot('trend-main', chart)}
    <div class="m-stats four">
      <div class="m-stat"><b>${fmtM(key, avg)}${m.unit === '%' ? '%' : ''}</b><span>Average</span></div>
      <div class="m-stat"><b class="delta ${cmp.tone}" style="font-size:17px">${IC[cmp.dir]}${cmp.txt}</b><span>vs previous ${rangeName}</span></div>
      <div class="m-stat"><b>${fmtM(key, vals[hiIdx])}</b><span>High${hiIdx >= 0 ? ' · ' + fMD(cur[hiIdx].date) : ''}</span></div>
      <div class="m-stat"><b>${fmtM(key, vals[loIdx])}</b><span>Low${loIdx >= 0 ? ' · ' + fMD(cur[loIdx].date) : ''}</span></div>
    </div>
  </article>

  <article class="card">
    <div class="card-h"><h2 class="card-t">Strain vs next-day recovery</h2><span class="card-note">90 days</span></div>
    ${slot('trend-scatter', pairs.length >= 5 ? scatterChart(pairs) : noData('This fills in after a week or so of recovery scores.'))}
    <p class="note chart-foot">${!hard.length || !easy.length ? 'Once you have both hard days (above 16) and easy days (under 10), this compares the recovery that followed each.' : `After days above 16 strain, your recovery averaged ${Math.abs(hardDiff)} points ${hardDiff >= 0 ? 'lower' : 'higher'} than after days under 10. The line shows the overall trend.`}</p>
  </article>

  <article class="card">
    <div class="card-h"><h2 class="card-t">This week vs last week</h2></div>
    <ul class="kv">${weekly}</ul>
  </article>`;
}

/* ==========================================================================
   Journal screen: yes or no questions about last night,
   and which habits seem to help or hurt your recovery.
   ========================================================================== */

/* For each habit, compares your average recovery after "yes" nights with "no" nights.
   A habit needs at least 4 of each before it shows up. */
function impacts(){
  const pool = days.slice(0, sel + 1).filter(x => fin(x.rec));
  return BEH.map(b => {
    const yes = pool.filter(x => x.beh[b.k]).map(x => x.rec), no = pool.filter(x => !x.beh[b.k]).map(x => x.rec);
    if (yes.length < 4 || no.length < 4) return null;
    return {b, pct:Math.round((mean(yes) - mean(no)) / mean(no) * 100), n:yes.length};
  }).filter(Boolean).sort((a, b) => b.pct - a.pct);
}

/* Builds the whole Journal screen. */
function renderJournal(){
  const d = days[sel], ev = new Date(d.date); ev.setDate(ev.getDate() - 1);

  <p class="eyebrow" style="margin:16px 2px 0">Refreshed daily</p>

  ${imp.length ? `<div class="ji-h" aria-hidden="true"><span class="hurts"><span class="ji-box"><span class="tri down"></span></span>Hurts</span><span class="pct">% Impact</span><span class="helps">Helps<span class="ji-box g"><span class="tri up"></span></span></span></div>
  ${imp.map(x => {
    const w = Math.abs(x.pct) / maxAbs * 50, pos = x.pct >= 0, col = x.pct === 0 ? '#82869D' : pos ? 'var(--good)' : 'var(--bad)';
    return `<div class="jir" role="img" aria-label="${x.b.name}: ${x.pct > 0 ? '+' : ''}${x.pct}% recovery impact, logged ${x.n} nights">
      <div class="jir-top"><b>${x.b.name}</b><span style="color:${col}">${x.pct > 0 ? '+' : ''}${x.pct}%</span></div>
      <div class="jir-bar"><i style="left:${pos ? 50 : 50 - w}%;width:${w}%;background:${col}"></i><em></em></div>
    </div>`;
  }).join('')}` : ''}
  <p class="note">Each bar compares your average Recovery on mornings after you answered yes against mornings after you answered no.</p>`;
}

/* ==========================================================================
   Coach screen: a chat where you ask Claude about your numbers.

   Inside the phone app, questions go through the app's own server.
   On claude.ai they go through the page's Claude connection. On the plain
   website there is no Claude, so the screen explains where the coach works.
   ========================================================================== */

/* Coach: asks Claude through the app's server or the claude.ai sample capability.
   coachState is loading, ready or off. coachBusy is true while an answer is coming in. */
let coachApi = null, coachState = 'loading', coachBusy = false, coachCtl = null, coachErr = '';
const chat = [];

/* Four starter questions that fit the day. */
function coachSuggestions(){
  const d = days[sel], z = zone(d.rec).k;
  const first = z === 'green' ? 'Should I train hard today?' : z === 'yellow' ? 'How hard should I train today?' : 'Why is my recovery low today?';
  return [first, 'How can I get more deep sleep?', d.isToday ? 'How do I hit my strain target today?' : 'How did this day compare to my usual?', 'Which habits hurt my recovery most?'];
}

/* The background Claude gets with every question: the rules for answering and the day's numbers. */
function coachContext(){
  const d = days[sel], st = d.night ? stageStats(d.night) : null, sx = stressOf(d), z = zone(d.rec), t = targetFor(d.rec), wk = lastN(sel, 7);
  const avg = k => baseline(k, sel).mean;
  const yes = BEH.filter(b => d.beh[b.k]).map(b => b.name.toLowerCase()), no = BEH.filter(b => !d.beh[b.k]).map(b => b.name.toLowerCase());
  const imp = impacts().map(x => `${x.b.name.toLowerCase()} ${x.pct > 0 ? '+' : ''}${x.pct}%`).join(', ');
  return [
    'You are the in-app coach for Rhythm, a fitness tracker. Answer the user\'s questions about their own data below.',
    'Rules: under 110 words. Plain sentences, no headings and no markdown symbols like ** or #. Use a few short lines starting with "- " only when a list really helps. Quote their actual numbers and be specific and practical about training, sleep and recovery. If something sounds like a medical concern, say it is worth raising with a doctor, since you are not one. Never use em dashes.',
    '',
    `Data for ${fDate(d.date)}${d.isToday ? `, day in progress, time now ${clock(NOW_MIN)}` : ''}:`,
    `Recovery ${fmtM('recovery', d.rec)}% (${z.label.toLowerCase()} zone; 30-day average ${Math.round(avg('recovery'))}%).`,
    `HRV ${fmtM('hrv', d.hrv)} ms (average ${Math.round(avg('hrv'))}). Resting heart rate ${fmtM('rhr', d.rhr)} bpm (average ${Math.round(avg('rhr'))}). Respiratory rate ${fNum(d.resp, 1)} rpm. Blood oxygen ${fNum(d.spo2, 1)}%. Skin temperature ${fmtM('temp', d.temp)} F versus baseline. VO2 max ${fNum(d.vo2, 1)}.`,
    !st ? 'Sleep: no night recorded.' : `Sleep ${fHM(d.sleepMin)} of ${fHM(d.need)} needed (${d.perf}% performance), in bed ${clock(d.night.bed)} to ${clock(d.night.wake)}, efficiency ${d.eff}%, ${st.cycles} cycles, ${d.night.disturb} wake-ups, consistency ${pctText(d.consistency)}. Stages: awake ${fHM(st.awake.min)}, light ${fHM(st.light.min)} (${Math.round(st.light.pct)}%), deep ${fHM(st.deep.min)} (${Math.round(st.deep.pct)}%), REM ${fHM(st.rem.min)} (${Math.round(st.rem.pct)}%). 30-day deep average ${fHM(fmean(days.slice(Math.max(0, sel - 30), sel).filter(x => x.night).map(x => x.night.tot.deep)) || 0)}.`,
    `Day strain ${fNum(d.strain, 1)} of 21 (target ${fNum(t.lo, 1)} to ${fNum(t.hi, 1)}), ${fNum(d.cal)} calories, ${fNum(d.steps)} steps.`,
    `Workouts: ${d.acts.length ? d.acts.map(a => `${a.name.toLowerCase()} at ${clock(a.start)}, ${a.dur} min, strain ${fNum(a.strain, 1)}, average heart rate ${a.avg}`).join('; ') : 'none'}.`,
    `Stress: day average ${fNum(sx.avg, 1)} on a 0 to 3 scale, peak ${fNum(sx.peak.v, 1)} at ${clock(sx.peak.m)}, ${sx.mins[2]} minutes high.`,
    `Last 7 days average: recovery ${pctText(fin(fmean(wk.map(x => x.rec))) ? Math.round(fmean(wk.map(x => x.rec))) : null)}, sleep ${fHM(fmean(wk.filter(x => x.night).map(x => x.sleepMin)) || 0)}, strain ${fNum(fmean(wk.map(x => x.strain)), 1)}, HRV ${fin(fmean(wk.map(x => x.hrv))) ? Math.round(fmean(wk.map(x => x.hrv))) + ' ms' : 'not measured'}.`,
    `Last night's journal: yes to ${yes.join(', ') || 'nothing'}; no to ${no.join(', ') || 'nothing'}.`,
    `Average effect of each habit on next-day recovery: ${imp || 'not enough data yet'}.`,
    EXT && !EXT.demo ? 'These are real readings from their ring. Scores marked calibrating use fewer than four nights of history.' : 'This is sample data in a demo app, but answer as if it were theirs.'
  ].join('\n');
}

/* Builds the chat screen. */
function renderCoach(){
  const d = days[sel];
  const orb = '<span class="corb" aria-hidden="true">R</span>';
  if (coachState !== 'ready'){
    const msg = coachState === 'loading' ? 'Connecting to Claude. One moment.' : 'The coach runs on claude.ai. Open this page from its claude.ai link to ask Claude about these numbers. It asks for your permission the first time and uses your own Claude account.';
    return `<div class="coach2"><div class="cmsg">${orb}<p>${msg}</p></div></div>`;
  }
  return `
  <div class="coach2" id="chat">
    <div class="cmsg">${orb}<p>How can Rhythm help? I can see your recovery, sleep stages, strain, stress and journal for ${fDate(d.date)}, plus your 30-day averages.</p></div>
    ${chat.map(m => m.role === 'user' ? `<div class="umsg">${esc(m.content)}</div>` : `<div class="cmsg">${orb}<p>${esc(m.content)}</p></div>`).join('')}
    ${coachBusy ? `<div class="cmsg">${orb}<p id="coach-stream" aria-live="polite">Thinking</p></div>` : ''}
  </div>
  ${coachErr ? `<p class="coach-err" role="alert">${esc(coachErr)}</p>` : ''}
  <div class="cdock">
    ${chat.length ? '' : `<div class="csug" role="group" aria-label="Suggested questions">${coachSuggestions().map(q => `<button data-ask="${esc(q)}"${coachBusy ? ' disabled' : ''}>${esc(q)}</button>`).join('')}</div>`}
    <form class="cask" id="askForm">
      <button type="button" class="newc" data-clearchat aria-label="New chat">${IC.newchat}</button>
      <div class="cfield">
        <label class="sr" for="askInput">Ask Rhythm anything</label>
        <input id="askInput" type="text" enterkeyhint="send" autocomplete="off" maxlength="400" placeholder="Ask Rhythm anything"${coachBusy ? ' disabled' : ''}>
        ${coachBusy ? `<button type="button" class="icon-btn" data-stop aria-label="Stop answering">${IC.stop}</button>` : `<button type="submit" class="icon-btn" aria-label="Send">${IC.up}</button>`}
      </div>
    </form>
  </div>
  <p class="note coach-note">${EXT && !EXT.demo ? 'Answers come from Claude using your ring data.' : 'Answers come from Claude using the sample data on this page.'} The coach is not a doctor, so take health concerns to one.</p>`;
}

/* Keeps the newest message in view. */
function scrollChat(){ if (tab === 'coach') window.scrollTo(0, document.documentElement.scrollHeight); }
function rerenderCoach(){ rerender('coach'); scrollChat(); }

/* Sends a question, shows the answer as it streams in, and turns errors into plain messages. */
async function askCoach(q){
  q = String(q || '').trim().slice(0, 400);
  if (!q || coachBusy || !coachApi) return;
  chat.push({role:'user', content:q});
  coachBusy = true; coachErr = '';
  rerenderCoach();
  const ctl = coachCtl = new AbortController();
  try {
    const res = await coachApi([{role:'user', content:coachContext()}, ...chat.slice(-10)], {
      cache:false, signal:ctl.signal,
      onText:({text}) => { const el = document.getElementById('coach-stream'); if (el){ el.textContent = text; scrollChat(); } }
    });
    chat.push({role:'assistant', content:res.text + (res.truncated ? '\n\n(Answer cut short. Try a narrower question.)' : '')});
  } catch (e) {
    const code = e && e.code;
    if (e && e.text && code !== 'refused') chat.push({role:'assistant', content:e.text + (code === 'cancelled' ? ' (stopped)' : '')});
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) coachErr = 'The coach needs permission to use Claude on this page. Reload the page and choose Allow to try again.';
    else if (code === 'not_configured') coachErr = 'The coach is not set up in this build yet. See the README for the one-time server setup.';
    else if (code === 'session_expired') coachErr = 'Your claude.ai session expired. Sign in again, then reload this page.';
    else if (code === 'rate_limited') coachErr = 'That is a lot of questions in a row. Give it a minute, then ask again.';
    else if (code === 'refused') coachErr = 'Claude would not answer that one. Try asking it a different way.';
    else if (code === 'prompt_too_large'){ chat.splice(0, Math.max(0, chat.length - 1)); coachErr = 'The chat got too long, so older messages were cleared. Ask again.'; }
    else if (code !== 'cancelled') coachErr = 'Could not reach Claude just now. Try again in a moment.';
  } finally {
    if (coachCtl === ctl) coachCtl = null;
    coachBusy = false;
    rerenderCoach();
  }
}

/* Works out how this page can reach Claude. Called once at start-up. */
async function connectCoach(){
  let api = null;
  if (window.RhythmNative && typeof window.RhythmNative.ask === 'function'){
    /* Inside the Rhythm app the coach goes through the app's own server. */
    api = (turns, opts = {}) => window.RhythmNative.ask(turns).then(text => {
      if (opts.signal && opts.signal.aborted) throw {code:'cancelled'};
      if (opts.onText) opts.onText({text, delta:text});
      return {text, truncated:false};
    }, e => { throw e && e.code ? e : {code:'upstream_error', message:String(e)}; });
  } else {
    try { api = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch (e) { api = null; }
  }
  coachApi = api; coachState = api ? 'ready' : 'off';
  rerenderCoach();
}

/* ==========================================================================

  sleep:{what:'Hours of sleep divided by the sleep your body needed last night.',
    measured:'Your sleep need is recalculated every night from a personal baseline, yesterday\'s strain, recent sleep debt and naps.',
    affects:['Bedtime and wake time', 'Yesterday\'s strain', 'Sleep debt from recent nights', 'Naps'],
    range:'Optimal is 85% or more, sufficient is 70 to 84% and poor is under 70%.'},
  sleepHrs:{what:'Total time asleep, not counting time awake in bed. The white marks on the chart show how much sleep you needed each night.',

/* Advice that fits the day, for the "What to do" list. */
function tipsFor(key, d, dl){
  const z = zone(d.rec).k;
  const T = {
    recovery: z === 'green' ? ['Plan your hardest workout of the week today.', 'Aim for strain inside your target to build fitness without digging a hole.'] : z === 'yellow' ? ['Train, but cap intensity. Zone 2 cardio or technique work fits well.', 'Get to bed 30 minutes earlier than usual.'] : ['Swap intense training for a walk or mobility.', 'Hydrate, skip alcohol and keep dinner light.', 'Go to bed early to pay down sleep debt.'],
    sleep: ['Keep your bedtime within 30 minutes of the night before.', 'Cut caffeine after 2 PM and keep the bedroom cool and dark.'],
    sleepHrs: ['Your need goes up after big strain days, so plan an earlier night after hard sessions.', 'A 20 minute nap before 3 PM can cover a small shortfall.'],
    strain: ['Match strain to recovery: push on green days, hold back on red ones.', 'Most fitness gains happen when you hit your target range several days a week.'],
    hrv: dl.dir === 'down' ? ['Favor easy aerobic work today.', 'Aim for your full sleep need tonight.', 'Alcohol and late meals are the most common HRV drains.'] : ['A good day for intervals or heavy lifting.', 'Keep hydration steady to hold HRV high.'],
    rhr: dl.dir === 'up' ? ['Take it easier until resting heart rate settles.', 'Check for late meals, alcohol or stress from yesterday.'] : ['A low resting heart rate is a sign of good aerobic fitness.', 'Keep your easy days easy to keep it there.'],
    resp: ['A sustained rise can be an early sign of illness. Watch how you feel.', 'Nasal breathing and a cool bedroom help keep it steady.'],
    spo2: ['Readings under 95% for several nights are worth raising with a doctor.', 'Altitude and a snug strap fit both affect this reading.'],
    temp: ['A jump of 1°F or more with a higher respiratory rate often comes before a cold.', 'A cool bedroom, around 65°F, supports deeper sleep.'],
    stress: ['A 1 minute breathing session can lower stress within minutes. Try the one on the Stress tab.', 'Short walks between meetings help reset your nervous system.'],
    vo2: ['Two zone 2 sessions a week build your aerobic base.', 'One interval session a week, like 4 rounds of 4 minutes hard, raises VO2 max fastest.'],
    calories: ['Fuel around your workouts. Carbs before and protein after helps recovery.', 'Low energy intake on high strain days slows recovery.'],
    steps: ['A 10 minute walk after meals adds about 1,000 steps and helps blood sugar.', 'Take calls on your feet to add steps without extra time.']
  };
  return T[key];
}

/* The sheet for one measurement: today's value, a chart, a table and the explanations above. */
function metricModal(key){
  const m = M[key], d = days[sel], v = m.get(d), dl = delta(key, sel), list = lastN(sel, modalRange), vals = list.map(m.get).filter(fin);

  else if (key === 'strain'){ const t = targetFor(d.rec); hero = chip('var(--strain)', '', strainLevel(v), true); lead = `The target based on recovery is ${fNum(t.lo, 1)} to ${fNum(t.hi, 1)}.`; }

  const chartFn = m.kind === 'line' ? vitalLine(key, modalRange) : dailyCols(key, modalRange, 190);

  return `
    <div class="m-head grab-zone"><div><p class="eyebrow">${fDate(d.date)}</p><h2 class="m-title" id="m-title">${m.name}</h2></div><button class="icon-btn close" data-close aria-label="Close">${IC.close}</button></div>

    <p class="m-lead">${lead}</p>

    <div class="m-stats">
      <div class="m-stat"><b>${fmtM(key, fmean(vals))}</b><span>${modalRange}-day avg</span></div>
      <div class="m-stat"><b>${fmtM(key, Math.min(...vals))}</b><span>Low</span></div>
      <div class="m-stat"><b>${fmtM(key, Math.max(...vals))}</b><span>High</span></div>
    </div>
    <section class="m-sec"><h3>What it means</h3><p>${INFO[key].what}</p></section>
    <section class="m-sec"><h3>How it is measured</h3><p>${INFO[key].measured}</p></section>
    <section class="m-sec"><h3>What affects it</h3><ul class="tips">${INFO[key].affects.map(t => `<li>${t}</li>`).join('')}</ul></section>
    <section class="m-sec"><h3>Typical range</h3><p>${INFO[key].range}</p></section>
    <section class="m-sec"><h3>What to do</h3><ul class="tips">${tipsFor(key, d, dl).map(t => `<li>${t}</li>`).join('')}</ul></section>
    <details class="tbl"><summary>View as table</summary><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>${m.name}${m.unit ? ` (${m.unit})` : ''}</th></tr></thead><tbody>
      ${list.slice().reverse().map(x => `<tr><td>${fDate(x.date)}</td><td>${fmtM(key, m.get(x))}</td></tr>`).join('')}
    </tbody></table></div></details>`;
}

/* The sheet for one workout: stats, heart rate during it and time in each zone. */
function actModal(k){
  const d = days[sel], a = d.acts[k], pts = hrSeries(d), end = a.start + a.dur;
  const z = zoneMinutes(pts, a.start, end), zmax = Math.max(...z, 1);
  const from = Math.max(0, a.start - 10), to = d.isToday ? Math.min(end + 16, NOW_MIN) : end + 16;
  const step = to - from > 90 ? 30 : 15, xt = []; for (let m = Math.ceil(from / step) * step; m <= to; m += step) xt.push(m);
  const pace = a.dist ? (a.type === 'cycle' ? [`${fNum(a.dist / (a.dur / 60), 1)} mph`, 'Avg speed'] : [`${fPace(a.dur / a.dist)} /mi`, 'Avg pace']) : null;
  const stats = [[`${a.dur} min`, 'Duration'], a.dist ? [`${fNum(a.dist, 1)} mi`, 'Distance'] : null, pace, [a.avg, 'Avg HR'], [a.max, 'Max HR'], [fNum(a.cal), 'Calories']].filter(Boolean);
  return `
    <div class="m-head grab-zone"><div><p class="eyebrow">${fDate(d.date)} · ${clock(a.start)}</p><h2 class="m-title" id="m-title">${a.name}</h2></div><button class="icon-btn close" data-close aria-label="Close">${IC.close}</button></div>
    <div class="m-big"><span class="m-num">${fNum(a.strain, 1)}</span>${chip('var(--strain)', '', `${strainLevel(a.strain)} strain`, true)}</div>
    <p class="m-lead">${clock(a.start)} to ${clock(end)}, part of a ${fNum(d.strain, 1)} strain day.</p>
    <div class="m-stats">${stats.map(([v, l]) => `<div class="m-stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <section class="m-sec"><h3>Heart rate</h3></section>
    <div style="margin-top:8px">${slot('m-chart', hrChart({label:`Heart rate during ${a.name}`, pts, from, to, acts:[a], xticks:xt, xfmt:clock, h:180}))}</div>
    <section class="m-sec"><h3>Time in zones</h3>
      <div class="zones">${[4, 3, 2, 1, 0].map(j => `<div class="zone"><span class="zl"><b>Zone ${j + 1}</b><span>${ZONES[j]}${j < 4 ? ' to ' + (ZONES[j + 1] - 1) : '+'} bpm</span></span><span class="ztrack"><span class="zbar" style="width:${z[j] / zmax * 100}%"></span></span><span class="zm">${z[j]} min</span></div>`).join('')}</div>
    </section>
    <section class="m-sec"><h3>What it means</h3><p>Activity strain measures how hard your heart worked during this session on the same 0 to 21 scale as day strain. Time in zones 4 and 5 builds speed and power. Zones 2 and 3 build your aerobic base.</p></section>`;
}

/* The sheet for one sleep stage: last night, a chart per night and how to get more. */
function stageModal(s){
  const d = days[sel], n = d.night, st = stageStats(n), x = st[s], info = STAGE_INFO[s];
  const [lo, hi] = info.range, pct = x.pct;
  const avgMin = fmean(days.slice(Math.max(0, sel - 30), sel).filter(y => y.night).map(y => y.night.tot[s]));
  const stc = pct > hi ? {c:'var(--yellow)', ic:IC.alert, t:'Above typical'} : pct < lo ? {c:'var(--yellow)', ic:IC.alert, t:'Below typical'} : {c:'var(--green)', ic:IC.check, t:'In typical range'};
  const list = lastN(sel, modalRange).filter(y => y.night), vals = list.map(y => y.night.tot[s] / 60);
  const ticks = niceTicks(0, Math.max(...vals), 3);
  const chart = colChart({label:`${STAGE[s]} per night`, data:list.map((y, i) => ({v:vals[i], color:`var(--${s})`, label:list.length <= 10 ? DOW[y.dow] : fMD(y.date)})),
    max:ticks[ticks.length - 1], ticks, tickFmt:t => fHM(t * 60), sel:list.length - 1, h:180, valFmt:v => fHM(v * 60),
    tip:i => `<b>${fDate(list[i].date)}</b>${STAGE[s]} ${fHM(vals[i] * 60)}`});
  const early = x.min ? Math.round(x.byThird[0] / x.min * 100) : 0, late = x.min ? Math.round(x.byThird[2] / x.min * 100) : 0;
  const stats = s === 'awake'
    ? [[x.periods, 'Wake-ups'], [`${x.longest} min`, 'Longest'], [`${n.latency} min`, 'To fall asleep'], [`${Math.round(pct)}%`, 'Of time in bed']]
    : [[x.periods, 'Periods'], [`${x.longest} min`, 'Longest'], [x.first != null ? `${x.first} min` : 'None', 'First one after'], [`${s === 'rem' ? late : early}%`, s === 'rem' ? 'In last third' : 'In first third']];
  return `
    <div class="m-head grab-zone"><div><p class="eyebrow">${fDate(d.date)} · Sleep stage</p><h2 class="m-title" id="m-title">${STAGE[s]}</h2></div>${closeBtn}</div>
    <div class="m-big"><span class="m-num">${fHM(x.min)}</span>${chip(stc.c, stc.ic, stc.t)}</div>
    <p class="m-lead">${Math.round(pct)}% ${info.basis} last night. Typical is ${info.rangeTxt}, and your 30-day average is ${avgMin == null ? 'not set yet' : fHM(avgMin)}.</p>
    <div class="m-stats four">${stats.map(([v, l]) => `<div class="m-stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <section class="m-sec"><h3>Last night</h3></section>
    <div style="margin-top:8px">${slot('m-hyp', hypnogram(d, {focus:s}))}</div>
    <section class="m-sec"><h3>What it is</h3><p>${info.what}</p></section>
    <section class="m-sec"><h3>What it does for you</h3><p>${info.does}</p></section>
    <div class="m-bar" style="margin-top:22px"><h3>Per night</h3>${segBtns('range', modalRange, [[7, '7D'], [30, '30D']])}</div>
    ${slot('m-chart', chart)}
    <section class="m-sec"><h3>${s === 'awake' ? 'How to wake up less' : 'How to get more'}</h3><ul class="tips">${info.tips.map(t => `<li>${t}</li>`).join('')}</ul></section>
    <details class="tbl"><summary>View as table</summary><div class="tbl-wrap"><table><thead><tr><th>Night</th><th>${STAGE[s]}</th></tr></thead><tbody>
      ${list.slice().reverse().map(y => `<tr><td>${fDate(y.date)}</td><td>${fHM(y.night.tot[s])}</td></tr>`).join('')}
    </tbody></table></div></details>`;
}

/* Box breathing: breathe in, hold, out and hold for 4 seconds each, 5 rounds.
   The number next to each step is how big the glowing circle gets. */
const PHASES = [['Breathe in', 1], ['Hold', 1], ['Breathe out', .5], ['Hold', .5]];
let breath = null;
function breatheModal(){
  return `
    <div class="m-head grab-zone"><div><p class="eyebrow">Stress reset</p><h2 class="m-title" id="m-title">Box breathing</h2></div><button class="icon-btn close" data-close aria-label="Close">${IC.close}</button></div>
    <div class="breathe">
      <div class="b-stage"><span class="b-ring"></span><span class="b-orb" id="orb"></span><div class="b-text" aria-live="polite"><b id="bPhase">Ready</b><span id="bCount">5 rounds · 80 sec</span></div></div>
      <div class="b-steps">${chip('var(--text-2)', '', 'In 4', true)}${chip('var(--text-2)', '', 'Hold 4', true)}${chip('var(--text-2)', '', 'Out 4', true)}${chip('var(--text-2)', '', 'Hold 4', true)}</div>
      <button class="btn" id="bStart" data-bstart>Start</button>
    </div>
    <section class="m-sec"><h3>Why it works</h3><p>Slow breathing with long holds activates your parasympathetic nervous system. Heart rate drops and HRV rises within a few rounds, which pulls your stress score down.</p></section>`;
}
function stopBreath(){ if (breath){ clearInterval(breath.t); breath = null; } }
function startBreath(){
  stopBreath();
  const orb = $('#orb'), ph = $('#bPhase'), ct = $('#bCount'), btn = $('#bStart');
  if (!orb) return;
  let sec = 0; const total = 80;
  const tick = () => {
    if (sec >= total){ stopBreath(); ph.textContent = 'Nice work'; ct.textContent = 'Session complete'; orb.style.transform = 'scale(.5)'; btn.textContent = 'Go again'; return; }
    const p = Math.floor(sec / 4) % 4, left = 4 - (sec % 4);
    if (sec % 4 === 0) orb.style.transform = `scale(${PHASES[p][1]})`;
    ph.textContent = PHASES[p][0];
    ct.textContent = `${left} · round ${Math.floor(sec / 16) + 1} of 5`;
    sec++;
  };
  btn.textContent = 'Stop';
  breath = {t:setInterval(tick, 1000)}; tick();
}

/* Showing and hiding sheets. MODALS maps a sheet type to the function that builds it. */
const modal = $('#modal'), sheet = $('#sheet');
const MODALS = {outlook:() => outlookModal(), metric:st => metricModal(st.key), act:st => actModal(st.k), breathe:() => breatheModal(), night:() => nightModal(), stage:st => stageModal(st.s)};
const modalHTML = st => '<div class="grab-zone" aria-hidden="true"><div class="grab"></div></div>' + MODALS[st.type](st);
function openModal(state, from){
  stopBreath();
  opener = modal.hidden ? (from || document.activeElement) : opener;
  modalState = state;
  sheet.innerHTML = modalHTML(state);
  sheet.style.transform = '';
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  hideTip();
  drawIn(sheet);
  sheet.scrollTop = 0;
  $('.close', sheet).focus({preventScroll:true});
}
function rerenderModal(focusSel){
  const st = sheet.scrollTop;
  sheet.innerHTML = modalHTML(modalState);
  drawIn(sheet); sheet.scrollTop = st;
  if (focusSel){ const f = $(focusSel, sheet); if (f) f.focus({preventScroll:true}); }
}
function closeModal(){
  if (modal.hidden) return;
  stopBreath();
  modal.hidden = true; modalState = null;
  document.body.style.overflow = '';
  hideTip();
  if (opener && document.contains(opener)) opener.focus({preventScroll:true});
}

/* Swipe the sheet down to close on touch screens. */
let drag = null;
sheet.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' || !e.target.closest('.grab-zone') || e.target.closest('button') || sheet.scrollTop > 0) return;
  drag = {y:e.clientY, id:e.pointerId, dy:0};
  sheet.classList.add('dragging');
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dy = Math.max(0, e.clientY - drag.y);
  sheet.style.transform = `translateY(${drag.dy}px)`;
});
const endDrag = () => {
  if (!drag) return;
  const dy = drag.dy; drag = null;
  sheet.classList.remove('dragging');
  sheet.style.transform = '';
  if (dy > 90) closeModal();
};
sheet.addEventListener('pointerup', endDrag);
sheet.addEventListener('pointercancel', endDrag);

/* ==========================================================================
   App: drawing screens, switching between them, and handling taps.
   This file runs last, so everything it needs already exists. It starts the page.
   ========================================================================== */

/* The function that builds each screen, and the HTML element each screen lives in. */
const RENDER = {overview:renderOverview, health:renderHealth, trends:renderTrends, more:renderMore, sleep:renderSleep, recovery:renderRecovery, strain:renderStrain, stress:renderStress, journal:renderJournal, coach:renderCoach};
const panel = name => document.getElementById('panel-' + name);

/* Rebuilds every screen. Used at start-up and when the picked day or the data changes. */
function renderAll(){
  CH.clear();
  TABS.forEach(k => { panel(k).innerHTML = RENDER[k](); });
  renderHeader(); renderNav();
  drawIn(panel(tab));
}

/* Rebuilds one screen, keeping a sideways-scrolled chip row where it was. */
function rerender(name, focusSel){
  const p = panel(name), chips = p.querySelector('.chips'), cx = chips ? chips.scrollLeft : 0;
  p.innerHTML = RENDER[name]();
  const c2 = p.querySelector('.chips'); if (c2) c2.scrollLeft = cx;
  drawIn(p);
  if (focusSel){ const f = p.querySelector(focusSel); if (f) f.focus({preventScroll:true}); }
}

/* Four sections live in the bottom bar; Sleep, Recovery, Strain, Stress, Journal and Coach open on top with a back button. */
function setTab(next){
  if (!TABS.includes(next)) next = 'overview';
  if (ROOTS.includes(next)) root = next;
  tab = next;
  if (actionsOpen){ actionsOpen = false; rerender('overview'); }
  TABS.forEach(k => { panel(k).hidden = k !== next; });
  renderHeader(); renderNav();
  hideTip();
  window.scrollTo(0, 0);
  drawIn(panel(next));
  store.set('tab', root);
  if (next === 'coach') scrollChat();
}

/* The "< TODAY >" day picker. */
function datePill(){
  return `<div class="datepill" role="group" aria-label="Choose a day">
    <button class="dbtn" data-day="-1" aria-label="Previous day"${sel <= N - SHOW ? ' disabled' : ''}>${IC.back}</button>
    <b aria-live="polite">${dayLabel()}</b>
    <button class="dbtn" data-day="1" aria-label="Next day"${sel >= N - 1 ? ' disabled' : ''}>${IC.chev}</button>

/* The top bar: the day picker and battery on Home and Health, a title on Trends and More,
   and a back button with a title on every other screen. */
function renderHeader(){
  let html;
  if (tab === 'overview' || tab === 'health'){
    const b = batteryPct(), s = streakDays();
    html = `<div class="hrow">
      <div class="hleft"><button class="avatar" data-tab="more" aria-label="Open More">R</button>${s ? `<span class="streak" aria-label="${s} night streak">${IC.flame}${s}</span>` : ''}</div>
      ${datePill()}
      <div class="hright">${fin(b) ? `<span class="battp" aria-label="Ring battery ${b}%">${IC.bolt}${b}%${IC.ringdev}</span>` : ''}</div>
    </div>`;
  } else if (ROOTS.includes(tab)){
    html = `<div class="hrow"><span></span><div class="htitle">${TITLES[tab]}</div><span></span></div>`;
  } else {
    const info = {sleep:'sleep', recovery:'recovery', strain:'strain', stress:'stress'}[tab];
    let mid;
    if (tab === 'sleep' || tab === 'recovery' || tab === 'strain'){
      mid = `<div class="hmid"><button class="dbtn" data-day="-1" aria-label="Previous day"${sel <= N - SHOW ? ' disabled' : ''}>${IC.back}</button><span class="htitle">${dayLabel()}</span><button class="dbtn" data-day="1" aria-label="Next day"${sel >= N - 1 ? ' disabled' : ''}>${IC.chev}</button></div>`;
    } else if (tab === 'stress'){
      mid = `<div class="htitle">Stress Monitor<span class="hsub">${dayLabel()}</span></div>`;
    } else {
      mid = `<div class="htitle">${TITLES[tab]}${tab === 'coach' ? '<br><span class="beta">Beta</span>' : ''}</div>`;
    }

  }
  $('#top').innerHTML = html;
}

/* The bottom bar. It only shows on the four main screens. */
function renderNav(){
  const nav = $('#bnav');
  nav.hidden = !ROOTS.includes(tab);
  nav.innerHTML = `<div class="bnav-pill">${[['overview', IC.home, 'Home'], ['health', IC.heart, 'Health'], ['trends', IC.trend, 'Trends'], ['more', IC.menu, 'More']]
    .map(([k, ic, l]) => `<button class="bn" data-tab="${k}"${tab === k ? ' aria-current="page"' : ''}>${ic}<span>${l}</span></button>`).join('')}</div>
    <button class="orbbtn" data-tab="coach" aria-label="Rhythm coach"><span>R</span></button>`;
}

/* Every tap on the page lands here. Buttons say what they do with data- attributes:
   data-go="sleep" opens the Sleep screen, data-metric="hrv" opens the HRV sheet, and so on.
   The handler checks them in order and does the first one that matches. */
document.addEventListener('click', e => {
  const t = e.target;
  let el;
  if (actionsOpen && !t.closest('[data-actions]')){ actionsOpen = false; rerender('overview'); }
  if ((el = t.closest('[data-native]'))){ if (window.RhythmNative) window.RhythmNative.post({type:el.dataset.native}); return; }
  if ((el = t.closest('[data-close]'))) return closeModal();
  if ((el = t.closest('[data-ask]'))) return askCoach(el.dataset.ask);
  if ((el = t.closest('[data-stop]'))){ if (coachCtl) coachCtl.abort(); return; }
  if ((el = t.closest('[data-clearchat]'))){ chat.length = 0; coachErr = ''; rerenderCoach(); return; }
  if ((el = t.closest('[data-actions]'))){ actionsOpen = !actionsOpen; return rerender('overview', '[data-actions]'); }
  if ((el = t.closest('[data-back]'))) return setTab(root);
  if ((el = t.closest('[data-day]'))){ const n = sel + +el.dataset.day; if (n >= N - SHOW && n <= N - 1){ sel = n; renderAll(); } return; }
  if ((el = t.closest('[data-outlook]'))) return openModal({type:'outlook'}, el);
  if ((el = t.closest('[data-coachq]'))){ closeModal(); setTab('coach'); return askCoach(el.dataset.coachq); }
  if ((el = t.closest('[data-tab]'))) return setTab(el.dataset.tab);
  if ((el = t.closest('[data-go]'))){ closeModal(); return setTab(el.dataset.go); }
  if ((el = t.closest('[data-stage]'))) return openModal({type:'stage', s:el.dataset.stage}, el);
  if ((el = t.closest('[data-night]'))) return openModal({type:'night'}, el);
  if ((el = t.closest('[data-range]'))){ modalRange = +el.dataset.range; return rerenderModal(`[data-range="${modalRange}"]`); }
  if ((el = t.closest('[data-bstart]'))){ if (breath){ stopBreath(); $('#bPhase').textContent = 'Paused'; $('#bCount').textContent = 'Tap start to begin again'; $('#orb').style.transform = 'scale(.5)'; el.textContent = 'Start'; } else startBreath(); return; }
  if ((el = t.closest('[data-breathe]'))) return openModal({type:'breathe'}, el);
  if ((el = t.closest('[data-rt]'))){
    recRange = +el.dataset.rt;
    el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el));
    return drawIn(el.closest('.card'));
  }
  if ((el = t.closest('[data-rest]'))){
    restMode = !restMode; el.setAttribute('aria-pressed', restMode);
    const svg = $('#hypno svg'); if (svg) svg.classList.toggle('rest', restMode);
    return;
  }
  if ((el = t.closest('[data-tk]'))){ trend.key = el.dataset.tk; store.set('trend', trend); return rerender('trends', `[data-tk="${trend.key}"]`); }
  if ((el = t.closest('[data-tr]'))){ trend.range = +el.dataset.tr; store.set('trend', trend); return rerender('trends', `[data-tr="${trend.range}"]`); }
  if ((el = t.closest('[data-goal]'))){ plan.goal = el.dataset.goal; store.set('plan', plan); return swapPlanner(`[data-goal="${plan.goal}"]`); }
  if ((el = t.closest('[data-wake]'))){ plan.wake = clamp(plan.wake + +el.dataset.wake, 240, 660); store.set('plan', plan); return swapPlanner(`[data-wake="${el.dataset.wake}"]`); }
  if ((el = t.closest('[data-j]'))){
    const d = days[sel], k = el.dataset.j, v = el.dataset.v === '1';
    d.beh[k] = v;
    const key = dayKey(d.date); JOURNAL[key] = {...(JOURNAL[key] || {}), [k]:v}; store.set('journal', JOURNAL);
    return rerender('journal', `[data-j="${k}"][data-v="${el.dataset.v}"]`);
  }
  if ((el = t.closest('[data-metric]'))) return openModal({type:'metric', key:el.dataset.metric}, el);
  if ((el = t.closest('[data-act]'))) return openModal({type:'act', k:+el.dataset.act}, el);
});

/* Swaps in a fresh sleep planner card without rebuilding the whole Sleep screen. */
function swapPlanner(focusSel){
  const old = panel('sleep').querySelector('.planner'); if (!old) return;
  const cx = old.querySelector('.chips').scrollLeft;
  old.insertAdjacentHTML('afterend', plannerHTML()); old.remove();
  const nu = panel('sleep').querySelector('.planner');
  nu.querySelector('.chips').scrollLeft = cx;
  const f = nu.querySelector(focusSel); if (f) f.focus({preventScroll:true});
}

/* Sending a coach question with the Enter key. */
document.addEventListener('submit', e => {
  if (e.target.id !== 'askForm') return;
  e.preventDefault();
  const inp = $('#askInput'); askCoach(inp && inp.value);
});

/* Keyboard: Escape closes a sheet, and Tab stays inside the open sheet. */
document.addEventListener('keydown', e => {
  if (modal.hidden) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeModal(); return; }
  if (e.key === 'Tab'){
    const f = [...sheet.querySelectorAll('button,summary,[href],[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* Hide the chart tooltip when you tap elsewhere or scroll, and redraw charts when the window changes size. */
document.addEventListener('pointerdown', e => { if (!e.target.closest('[data-chart] svg')) hideTip(); }, true);
window.addEventListener('scroll', hideTip, {passive:true});
sheet.addEventListener('scroll', hideTip, {passive:true});
let rz = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => { hideTip(); drawIn(panel(tab)); if (!modal.hidden) drawIn(sheet); });
});

/* The app pushes fresh data after every sync. */
window.__rhythmUpdate = x => {
  if (!x || !Array.isArray(x.days) || !x.days.length) return;
  EXT = x; loadExternal(x); sel = N - 1;
  closeModal();
  renderAll();
};

/* Start: draw every screen, open the right one, then connect the coach. */
renderAll();
setTab(tab);
connectCoach();
})();
</script>
