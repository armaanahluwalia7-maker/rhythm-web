  5: [['run', 400, 38]],
  6: [['cycle', 510, 95]]
};

/* Journal behaviors, answered for the evening before each morning.
   p is the chance of "yes" on a given weekday, and eff is how a "yes" nudges HRV, resting heart rate and sleep. */
const BEH = [
  {k:'alcohol',   name:'Alcohol',             q:'Did you have any alcohol?',               p:dw => dw === 5 || dw === 6 ? .45 : .1, eff:{hrv:-8, rhr:3, sleep:-10}},
  {k:'caffeine',  name:'Caffeine after 2 PM', q:'Coffee, tea or energy drinks late?',      p:() => .25, eff:{sleep:-22, hrv:-2}},
  {k:'lateMeal',  name:'Late meal',           q:'Did you eat within 2 hours of bed?',      p:() => .25, eff:{hrv:-4, rhr:2}},
  {k:'screens',   name:'Screens in bed',      q:'Did you use your phone in bed?',          p:() => .5,  eff:{sleep:-12, hrv:-1}},
  {k:'reading',   name:'Read before bed',     q:'Did you read before sleep?',              p:() => .4,  eff:{hrv:3, sleep:6}},
  {k:'meditation',name:'Meditation',          q:'Did you meditate or do breathwork?',      p:() => .3,  eff:{hrv:4}},
  {k:'hydrated',  name:'Hydrated',            q:'Did you drink 3 liters of water?',        p:() => .6,  eff:{hrv:2}},
  {k:'stretch',   name:'Stretching',          q:'Did you stretch or foam roll?',           p:() => .35, eff:{hrv:2, rhr:-1}}
];

/* Builds one made-up night: stage blocks (awake, light, deep, REM) that repeat in about 90 minute cycles,
   with more deep sleep early in the night and more REM toward morning, the way real sleep works. */
function buildNight(r, sleepMin, bed){
  const segs = []; let t = bed, slept = 0;
  const add = (s, d) => {
    d = Math.max(1, Math.round(d));
    if (s !== 'awake'){ if (slept >= sleepMin) return; d = Math.min(d, sleepMin - slept); slept += d; }
    const last = segs[segs.length - 1];
    if (last && last.s === s) last.b += d; else segs.push({s, a:t, b:t + d});
    t += d;
  };
  add('awake', 5 + r() * 11);
  for (let k = 0; slept < sleepMin && k < 14; k++){
    add('light', 14 + r() * 14);
    const deep = 40 - k * 10 + gauss(r) * 5;
    if (deep > 6) add('deep', deep);
    add('light', 14 + r() * 14);
    add('rem', Math.max(4, 5 + k * 5 + gauss(r) * 3.5));
    if (r() < .38 && slept < sleepMin) add('awake', 2 + r() * 5);
  }
  add('awake', 3 + r() * 6);
  const tot = {awake:0, light:0, deep:0, rem:0};
  segs.forEach(g => tot[g.s] += g.b - g.a);
  const disturb = segs.filter((g, k) => g.s === 'awake' && k > 0 && k < segs.length - 1).length;
  return {segs, bed, wake:t, inBed:t - bed, tot, latency:segs[0].b - segs[0].a, disturb};
}

/* Journal answers people saved, by date. They replace the made-up answers. */
const JOURNAL = store.get('journal', {});
const dayKey = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

/* The list of days every screen reads from. */
const days = [];

/* Fills `days` with 200 days of sample data.
   Each day's numbers depend on the day before (a hard workout means more sleep needed and lower HRV),
   so the charts tell a believable story. The last day ("today") uses fixed numbers so it always looks the same. */
function generateSample(){
  let prevStrain = 11; const debt = [];
  for (let i = 0; i < N; i++){
    const r = mulberry32(9001 + i * 7919);
    const date = new Date(END); date.setDate(END.getDate() - (N - 1 - i));
    const dow = date.getDay(), isToday = i === N - 1, prevDow = (dow + 6) % 7;
    let beh = {};
    BEH.forEach(b => { beh[b.k] = r() < b.p(prevDow); });
    if (isToday) beh = {alcohol:false, caffeine:false, lateMeal:false, screens:true, reading:true, meditation:false, hydrated:true, stretch:true};
    const eff = {hrv:0, rhr:0, sleep:0};
    BEH.forEach(b => { if (beh[b.k]) for (const k in b.eff) eff[k] += b.eff[k]; });

    let needStrain = Math.round(clamp((prevStrain - 10) * 3.2, 0, 35));
    let needDebt = Math.round(clamp(debt.slice(-3).reduce((a, b) => a + b, 0) * .18, 0, 45));
    if (isToday){ needStrain = 23; needDebt = 21; }
    const need = 458 + needStrain + needDebt;
    const weekend = dow === 0 || dow === 6;
    let sleepMin = Math.round(need * clamp(.9 + gauss(r) * .07 + (weekend ? .04 : 0), .7, 1.03) + eff.sleep);
    if (isToday) sleepMin = 462;
    let bed = Math.round(-72 + gauss(r) * 16 + (weekend ? 28 : 0));
    if (isToday) bed = -69;
    const night = buildNight(r, sleepMin, bed);
    const perf = Math.min(100, Math.round(sleepMin / need * 100));

    let hrv = Math.round(clamp(63 + gauss(r) * 6 + (perf - 88) * .3 - (prevStrain - 11) * .9 + eff.hrv, 34, 98));
    let rhr = Math.round(clamp(54 - (hrv - 63) * .13 + gauss(r) * 1.2 + (prevStrain > 15 ? 1 : 0) + eff.rhr, 44, 66));
    let resp = +(14.6 + gauss(r) * .22).toFixed(1);
    let spo2 = +clamp(96.6 + gauss(r) * .5, 94.2, 99.2).toFixed(1);
    let temp = +(gauss(r) * .22).toFixed(1);
    if (i >= N - 19 && i <= N - 17){ hrv -= 15; rhr += 4; resp = +(resp + 1.1).toFixed(1); temp = +(temp + 1.0).toFixed(1); }
    let rec = Math.round(clamp(52 + (hrv - 63) * 1.9 + (perf - 85) * .55 - (rhr - 54) * 2.4 + gauss(r) * 5, 6, 99));

    const acts = [];
    for (const [type, start, dur] of PLAN[dow]){
      const m = ACT[type];
      if (!isToday && r() < .12) continue;
      let st = Math.round(start + (r() - .5) * 30), du = Math.max(15, Math.round(dur * (.88 + r() * .24)));
      let s = +clamp(m.base + du * m.rate + gauss(r) * .6, 1, 19.5).toFixed(1);
      let avg = Math.round(MAX_HR * m.int + gauss(r) * 4), mx = Math.round(avg + 14 + r() * 14);
      let cal = Math.round(du * m.cal * (.9 + r() * .2));
      let dist = m.mph ? +(du / 60 * m.mph * (.95 + r() * .1)).toFixed(1) : null;
      if (isToday && type === 'run'){ st = 405; du = 42; s = 10.9; avg = 152; mx = 176; cal = 496; dist = 5.2; }
      if (isToday && type === 'core'){ st = 1050; du = 24; s = 5.6; avg = 128; mx = 149; cal = 186; }
      acts.push({type, name:m.name, start:st, dur:du, strain:s, avg, max:mx, cal, dist});
    }
    acts.sort((a, b) => a.start - b.start);

    const baseLoad = -Math.log(1 - clamp(5 + gauss(r) * .8, 2, 9) / 21);
    const load = acts.reduce((t, a) => t - Math.log(1 - a.strain / 21), 0) * .75 + baseLoad;
    const maxAct = acts.reduce((m, a) => Math.max(m, a.strain), 0);
    let strain = +Math.max(maxAct + .3, 21 * (1 - Math.exp(-load))).toFixed(1);
    let steps = Math.round(4200 + r() * 3200 + acts.reduce((t, a) => t + (a.type === 'run' ? a.dur * 165 : a.type === 'walk' ? a.dur * 110 : 0), 0));
    if (isToday){ hrv = 71; rhr = 51; resp = 14.8; spo2 = 96.8; temp = .2; rec = 78; strain = 12.6; steps = 9412; }
    const frac = isToday ? NOW_MIN / 1440 : 1;
    const cal = Math.round(1790 * frac + acts.reduce((t, a) => t + a.cal, 0) + steps * .035);
    const consistency = isToday ? 81 : Math.round(70 + r() * 22);
    const sleepStress = isToday ? 4 : Math.round(clamp(4 + gauss(r) * 2 + (beh.alcohol ? 5 : 0) + (beh.lateMeal ? 2 : 0), 0, 24));
    const stressBias = gauss(r) * .12 + (weekend ? -.12 : .08);
    const work = weekend ? 1 + r() * 3 : 5 + r() * 8;
    const eff2 = Math.round(sleepMin / night.inBed * 100);
    const vo2 = isToday ? 48.7 : +(46.2 + i * .012 + gauss(r) * .3).toFixed(1);

    const saved = JOURNAL[dayKey(date)];
    if (saved) Object.assign(beh, saved);

    days.push({i, date, dow, isToday, beh, need, needStrain, needDebt, sleepMin, perf, night, eff:eff2, hrv, rhr, resp, spo2, temp, rec, acts, strain, steps, cal, consistency, sleepStress, stressBias, work, vo2});
    debt.push(Math.max(0, need - sleepMin));
    prevStrain = strain;
  }
  days.forEach((d, i) => { d.nextBed = days[i + 1] ? days[i + 1].night.bed : d.night.bed; });
}

/* Day records from the app's metrics engine. Missing sensors arrive as null. */
function loadExternal(x){
  days.length = 0;
  x.days.forEach((r, i) => {
    const [y, mo, dd] = String(r.date).split('-').map(Number);
    const date = new Date(y, mo - 1, dd);
    days.push(Object.assign({}, r, {i, date, dow:date.getDay(), real:true, beh:Object.assign({}, JOURNAL[dayKey(date)] || {}), _hr:r.hr || [], stressRaw:r.stress || [], acts:r.acts || []}));
  });
  N = days.length; SHOW = Math.min(30, N);
  if (x.nowMin != null) NOW_MIN = x.nowMin;
  if (x.maxHr) MAX_HR = x.maxHr;
  ZONES = [.5, .6, .7, .8, .9].map(f => Math.round(f * MAX_HR));
}

/* The heart rate for a sample day as [minute, bpm] points every 2 minutes.
   Low while asleep, higher while awake, a bump during the workday and a climb during each workout. */
function hrSeries(d){
  if (d._hr) return d._hr;
  const r = mulberry32(424242 + d.i * 131), pts = [];
  const wake = d.night.wake, bedNext = 1440 + d.nextBed, end = d.isToday ? NOW_MIN : 1440;
  let boost = 0;
  for (let m = 0; m <= end; m += 2){
    let hr;
    if (m < wake) hr = d.rhr + 2 + 6 * Math.abs(m - 210) / 300 + gauss(r) * 1.2;
    else if (m > bedNext) hr = d.rhr + 6 + gauss(r) * 1.4;
    else {
      hr = d.rhr + 19 + 6 * Math.sin(m / 75) + gauss(r) * 3.2;
      if (m > 780 && m < 1000) hr += d.work * Math.sin((m - 780) / 220 * Math.PI);
      if (boost > 0){ hr += boost; boost -= 4; } else if (r() < .03) boost = 18 + r() * 22;
    }
    for (const a of d.acts){
      const e = a.start + a.dur;
      if (m >= a.start && m <= e){
        const p = (m - a.start) / a.dur, ramp = Math.min(1, (m - a.start) / 6);
        const target = a.avg + (a.max - a.avg) * .5 * Math.sin(p * Math.PI) + gauss(r) * 5;
        hr = Math.min(a.max, hr + (target - hr) * ramp);
      } else if (m > e && m < e + 24){
        hr = Math.max(hr, a.avg - (m - e) * 3.4 + gauss(r) * 2);
      }
    }
    pts.push([m, Math.round(hr)]);
  }
  return (d._hr = pts);
}

/* Heart rate zones 1 to 5 start at 50, 60, 70, 80 and 90% of your max heart rate. */
let ZONES = [.5, .6, .7, .8, .9].map(f => Math.round(f * MAX_HR));

/* Load the data now: the ring's if the app handed it over, otherwise the sample. */
if (EXT) loadExternal(EXT); else generateSample();

/* Minutes spent in each heart rate zone between two times of day. */
function zoneMinutes(pts, from, to){
  const z = [0, 0, 0, 0, 0];
  pts.forEach(([m, hr], i) => {
    if (m < from || m > to) return;
    const nx = pts[i + 1], dt = nx ? Math.min(10, nx[0] - m) : 2;
    for (let k = 4; k >= 0; k--) if (hr >= ZONES[k]){ z[k] += dt; break; }
  });
  return z.map(Math.round);
}

/* Stress through the day on a 0 to 3 scale, worked out once per day and then remembered.
   Real data comes from the ring. For sample data, stress is how far heart rate sits above resting
   while you are awake and not working out, smoothed over about half an hour. */
function stressOf(d){
  if (d._st) return d._st;
  if (d.real) return (d._st = stressSummary(d, (d.stressRaw || []).map(([m, v], k, raw) => {
    if (v == null) return [m, null];
    let s = 0, c = 0;
    for (const q of raw) if (q[1] != null && Math.abs(q[0] - m) <= 15){ s += q[1]; c++; }
    return [m, +(s / c).toFixed(2)];
  })));
  const pts = hrSeries(d), wake = d.night.wake, end = d.isToday ? NOW_MIN : Math.min(1440, 1440 + d.nextBed);
  const raw = pts.map(([m, hr]) => {
    if (m < wake + 10 || m > end) return null;
    if (d.acts.some(a => m >= a.start - 4 && m <= a.start + a.dur + 24)) return null;
    return clamp((hr - d.rhr - 10) / 16 + d.stressBias, 0, 3);
  });
  const sm = raw.map((v, k) => {
    if (v == null) return null;
    let s = 0, c = 0;
    for (let j = Math.max(0, k - 7); j <= Math.min(raw.length - 1, k + 7); j++) if (raw[j] != null){ s += raw[j]; c++; }
    return +(s / c).toFixed(2);
  });
  return (d._st = stressSummary(d, pts.map((p, k) => [p[0], sm[k]]), wake, end));
}

/* Totals for a stress series: the average, minutes in each level, the peak and the latest reading. */
function stressSummary(d, series, from, to){
  const vals = series.map(q => q[1]).filter(v => v != null);
  const mins = [0, 0, 0];
  series.forEach(([m, v], k) => { if (v == null) return; const nx = series[k + 1], dt = nx ? Math.min(30, nx[0] - m) : 2; mins[v < 1 ? 0 : v < 2 ? 1 : 2] += dt; });
  let peak = {v:0, m:series.length ? series[0][0] : 0}; series.forEach(([m, v]) => { if (v != null && v > peak.v) peak = {v, m}; });
  let now = null; for (let k = series.length - 1; k >= 0; k--) if (series[k][1] != null){ now = series[k][1]; break; }
  if (from == null) from = series.length ? Math.floor(series[0][0] / 60) * 60 : 360;
  if (to == null) to = d.isToday ? NOW_MIN : 1440;
  return {series, avg:vals.length ? +mean(vals).toFixed(1) : null, mins:mins.map(Math.round), peak, now, from, to};
}

/* Facts about one night's sleep stages: how many cycles, the share of each stage,
   the longest block, and how much of each stage fell in each third of the night. */
function stageStats(n){
  if (n._ss) return n._ss;
  const segs = n.segs, onset = segs[0].s === 'awake' ? segs[0].b : n.bed;
  const sleepTot = n.tot.light + n.tot.deep + n.tot.rem;
  const third = n.inBed / 3, cuts = [n.bed, n.bed + third, n.bed + 2 * third, n.wake];
  const out = {cycles:segs.filter(g => g.s === 'rem').length, onset, sleepTot, cuts};
  ['awake', 'rem', 'light', 'deep'].forEach(s => {
    const blocks = segs.filter((g, k) => g.s === s && !(s === 'awake' && (k === 0 || k === segs.length - 1)));
    const byThird = [0, 1, 2].map(j => segs.filter(g => g.s === s).reduce((t, g) => t + Math.max(0, Math.min(g.b, cuts[j + 1]) - Math.max(g.a, cuts[j])), 0));
    out[s] = {min:n.tot[s], pct:s === 'awake' ? n.tot[s] / n.inBed * 100 : n.tot[s] / sleepTot * 100, periods:blocks.length,
      longest:blocks.reduce((m, g) => Math.max(m, g.b - g.a), 0), first:blocks.length ? blocks[0].a - onset : null, byThird};
  });
  return (n._ss = out);
}

/* What each sleep stage is, its healthy range and tips. Shown in the sleep stage sheets. */
const STAGE_INFO = {
  awake:{range:[0, 10], basis:'of time in bed', rangeTxt:'under 10% of time in bed',
    what:'Short wake-ups are a normal part of sleep. Most people wake 10 to 20 times a night and remember almost none of them.',
    does:'Nothing restorative happens while you are awake, so long or frequent wake-ups take time away from your other stages.',
    tips:['Keep the bedroom cool, dark and quiet.', 'Cut back on fluids in the last hour before bed.', 'Alcohol causes more wake-ups in the second half of the night.']},
  light:{range:[45, 60], basis:'of sleep', rangeTxt:'45 to 60% of sleep',
    what:'Light sleep, stages N1 and N2, is the bridge between being awake and deeper sleep. It makes up about half of every night.',
    does:'Heart rate and body temperature drop. Bursts of brain activity called sleep spindles help lock in memories and new motor skills.',
    tips:['Light sleep takes over when deep and REM get cut short, so protect your total sleep time.', 'A steady bedtime keeps your sleep cycles regular.']},
  deep:{range:[15, 25], basis:'of sleep', rangeTxt:'15 to 25% of sleep',
    what:'Slow wave sleep, stage N3, is the most physically restorative stage. Brain waves slow right down and you are hardest to wake.',
    does:'Growth hormone peaks, muscles repair and your brain clears out waste. Most of it comes in the first half of the night.',
    tips:['Hard training days raise your need for deep sleep.', 'Go to bed at a regular time, since deep sleep is packed into your first few cycles.', 'Skip alcohol close to bed. It suppresses deep sleep.']},
  rem:{range:[20, 25], basis:'of sleep', rangeTxt:'20 to 25% of sleep',
    what:'REM, or rapid eye movement sleep, is when most dreaming happens. Your brain is almost as active as when you are awake while your muscles stay relaxed.',
    does:'REM supports learning, memory, mood and creativity. Each REM period gets longer toward morning.',
    tips:['Sleep through your final cycle. The longest REM period comes right before you wake.', 'Waking an hour early can cut your REM by about a third.', 'Alcohol and cannabis both suppress REM.']}
};

/* ==========================================================================
   Metrics: turning raw numbers into scores, colors and comparisons.

   M lists every measurement the page knows about (recovery, HRV, steps...)
   with its name, unit and whether higher is better. baseline() works out
   your normal range from the last 30 days, and delta() compares today to it.
   ========================================================================== */

/* Recovery zone for a 0 to 100 score: green (67 and up), yellow (34 to 66) or red. */
const zone = v => !fin(v) ? {k:'none', c:'var(--muted)', label:'No data', note:'Wear your ring overnight', ic:IC.flat}
  : v >= 67 ? {k:'green', c:'var(--green)', label:'Green', note:'Ready to perform', ic:IC.check}
  : v >= 34 ? {k:'yellow', c:'var(--yellow)', label:'Yellow', note:'Maintaining', ic:IC.flat}
  : {k:'red', c:'var(--red)', label:'Red', note:'Prioritize rest', ic:IC.alert};

/* Words for a strain score (0 to 21) and a stress level (0 to 3). */
const strainLevel = s => s < 10 ? 'Light' : s < 14 ? 'Moderate' : s < 18 ? 'High' : 'All out';
const stressLevel = v => v < 1 ? {label:'Low', c:'var(--st-low)'} : v < 2 ? {label:'Medium', c:'var(--st-med)'} : {label:'High', c:'var(--st-high)'};

/* Optimal, Sufficient or Poor. lo and hi are the cutoffs; lowerBetter flips them for things like stress. */
const grade = (v, lo, hi, lowerBetter) => {
  if (!fin(v)) return {label:'No data', c:'var(--muted)', ic:IC.flat};
  const ok = lowerBetter ? v <= lo : v >= hi, mid = lowerBetter ? v <= hi : v >= lo;
  return ok ? {label:'Optimal', c:'var(--good)', ic:IC.check} : mid ? {label:'Sufficient', c:'#A4A7B8', ic:IC.flat} : {label:'Poor', c:'var(--bad)', ic:IC.alert};
};
const sleepGrade = p => grade(p, 70, 85);

/* Today's strain target. A better recovery means a higher target. */
const targetFor = rec => { const c = 5 + (fin(rec) ? rec : 60) * .12; return {lo:+(c - 1.2).toFixed(1), hi:+(c + 1.2).toFixed(1)}; };

/* Every measurement the page can show.
   get: reads the value from a day. unit: shown after the number. kind: bar ("col") or line chart.
   better: "up" or "down" when one direction is better. rel: compare in percent. tol: the smallest change worth showing. */
const M = {
  recovery: {name:'Recovery', unit:'%', get:d => d.rec, kind:'col', max:100, ticks:[0,33,67,100], color:v => zone(v).c, better:'up'},
  sleep:    {name:'Sleep performance', unit:'%', get:d => d.perf, kind:'col', max:100, ticks:[0,50,100], color:() => 'var(--sleep)', better:'up'},
  sleepHrs: {name:'Hours of sleep', short:'Sleep', unit:'', get:d => d.sleepMin / 60, fmt:v => fHM(v * 60), kind:'col', max:10, ticks:[0,4,8], tickFmt:t => t + 'h', color:() => 'var(--sleep)', better:'up', rel:true, marker:d => d.need / 60},
  strain:   {name:'Day strain', short:'Strain', unit:'', get:d => d.strain, dec:1, kind:'col', max:21, ticks:[0,7,14,21], color:() => 'var(--strain)', better:null},
  hrv:      {name:'Heart rate variability', short:'HRV', unit:'ms', get:d => d.hrv, kind:'line', better:'up', rel:true, tol:8},
  rhr:      {name:'Resting heart rate', short:'Resting HR', unit:'bpm', get:d => d.rhr, kind:'line', better:'down', rel:true, tol:3},
  resp:     {name:'Respiratory rate', short:'Resp rate', unit:'rpm', get:d => d.resp, dec:1, kind:'line', better:null, tol:.7},
  spo2:     {name:'Blood oxygen', short:'SpO2', unit:'%', get:d => d.spo2, dec:1, kind:'line', better:null, tol:1.2},
  temp:     {name:'Skin temperature', unit:'°F', get:d => d.temp, dec:1, signed:true, kind:'line', better:null, tol:.7},
  stress:   {name:'Stress', unit:'', get:d => stressOf(d).avg, dec:1, kind:'col', max:3, ticks:[0,1,2,3], color:v => stressLevel(v).c, better:'down'},
  calories: {name:'Calories burned', short:'Calories', unit:'cal', get:d => d.cal, kind:'col', tickFmt:kFmt, color:() => 'var(--strain)', better:null, rel:true},
  steps:    {name:'Steps', unit:'', get:d => d.steps, kind:'col', tickFmt:kFmt, color:() => 'var(--strain)', better:'up', rel:true},
  vo2:      {name:'VO2 max', unit:'ml/kg/min', ksUnit:'', get:d => d.vo2, dec:1, kind:'line', better:'up', tol:1.5}
};

/* A value formatted the way its measurement wants, like "7:42" for hours of sleep or "+0.2" for temperature. */
const fmtM = (key, v) => { if (!fin(v)) return '--'; const m = M[key]; if (m.fmt) return m.fmt(v); return (m.signed && v > 0 ? '+' : '') + fNum(v, m.dec || 0); };
const unitSuffix = m => m.unit === '%' ? '%' : m.unit ? ' ' + m.unit : '';

/* The n days ending on day i. */
const lastN = (i, n) => days.slice(Math.max(0, i - n + 1), i + 1);

/* Population values used until a person has three days of their own data. */
const POP = {recovery:60, sleep:85, sleepHrs:7.5, strain:10, hrv:55, rhr:60, resp:15, spo2:97, temp:0, stress:1, calories:2300, steps:7000, vo2:42};

/* Your normal range for a measurement: the average of the 30 days before day i, give or take. */
function baseline(key, i){
  const vals = days.slice(Math.max(0, i - 30), i).map(M[key].get).filter(fin);
  if (vals.length < 3){ const mu = POP[key], tol = M[key].tol || Math.max(Math.abs(mu) * .1, 1); return {mean:mu, sd:tol, lo:mu - tol, hi:mu + tol, tol, cal:true}; }
  const mu = mean(vals), s = sd(vals), tol = Math.max(s * 1.8, M[key].tol || 0);
  return {mean:mu, sd:s, lo:mu - tol, hi:mu + tol, tol};
}

/* Compares a value with a reference, giving the direction, whether that is good or bad, and text like "12%". */
function compare(key, v, ref){
  const m = M[key];
  if (!fin(v) || !fin(ref) || (m.rel && ref === 0)) return {dir:'flat', tone:'flat', txt:'--'};
  let diff = v - ref, txt;
  if (m.rel){
    const p = Math.round(diff / ref * 100); diff = p;
    txt = p === 0 ? 'Even' : `${Math.abs(p)}%`;
  } else {
    const dd = +(Math.abs(diff)).toFixed(m.dec || 0);
    if (dd === 0) diff = 0;
    txt = diff === 0 ? 'Even' : `${m.fmt ? m.fmt(Math.abs(diff)) : fNum(dd, m.dec || 0)}${m.unit === '%' ? ' pts' : m.unit ? ' ' + m.unit : ''}`;
  }
  const dir = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const tone = !m.better || dir === 'flat' ? 'flat' : dir === m.better ? 'good' : 'bad';
  return {dir, tone, txt};
}

/* Today against your 30-day average, with friendly text for missing data and the first few days. */
function delta(key, i){
  const b = baseline(key, i), v = M[key].get(days[i]);
  if (!fin(v)) return {dir:'flat', tone:'flat', txt:'No data', b};
  if (b.cal) return {dir:'flat', tone:'flat', txt:'Calibrating', b};
  const c = compare(key, v, b.mean);
  return {...c, txt: c.txt === 'Even' ? 'Even with avg' : c.txt + ' vs avg', b};
}

/* HTML for a comparison ("^ 12% vs avg") and for a small colored label chip. */
const deltaHTML = dl => `<span class="delta ${dl.tone}">${IC[dl.dir]}${dl.txt}</span>`;
const chip = (c, ic, text, dot) => `<span class="chip${dot ? ' dot' : ''}" style="--cc:${c}">${ic || ''}${text}</span>`;

/* ==========================================================================
   State: what the page is showing right now.

   Which screen is open, which day is picked, the sleep plan and the trend
   settings. Some of these are saved, so the page opens the way you left it.
   ========================================================================== */

/* Every screen. The first four live in the bottom bar. The rest open on top with a back button. */
const TABS = ['overview', 'health', 'trends', 'more', 'sleep', 'recovery', 'strain', 'stress', 'journal', 'coach'];
const ROOTS = ['overview', 'health', 'trends', 'more'];
const TITLES = {overview:'Home', health:'Health', trends:'Trends', more:'More', journal:'Journal', coach:'Rhythm Coach', stress:'Stress Monitor', sleep:'Sleep', recovery:'Recovery', strain:'Strain'};

/* sel is the index of the day being shown in `days` (the last one is today).
   tab is the open screen. recRange and modalRange are 7 or 30 day chart ranges. */
let sel = N - 1, tab = 'overview', recRange = 30, modalRange = 30;

/* The Trends screen choices and the sleep plan, saved between visits. */
let trend = store.get('trend', {key:'recovery', range:30});
let plan = store.get('plan', {goal:'perform', wake:405});

/* The open pop-up sheet, and the button that opened it (focus goes back there when it closes). */
let modalState = null, opener = null;

/* Reopen the bottom-bar screen you were last on, and throw away saved trend settings that no longer make sense. */
{ const t = store.get('tab', 'overview'); if (ROOTS.includes(t)) tab = t; }
if (!M[trend.key] || ![7, 30, 90].includes(trend.range)) trend = {key:'recovery', range:30};

/* root is the bottom-bar screen the back button returns to. actionsOpen is the + menu on the home screen. */
let root = ROOTS.includes(tab) ? tab : 'overview', actionsOpen = false;

/* The "Restorative only" switch on the sleep chart. */
let restMode = false;

/* ==========================================================================
   Charts: the bar, line and sleep charts, drawn as SVG pictures.

   Charts need to know how wide they are before they can be drawn, so a screen
   first leaves an empty box with slot(), and drawIn() fills every box once the
   screen is visible. Each chart function returns a "draw" function for its box.
   ========================================================================== */

/* The draw function for every chart box, by box id. */
const CH = new Map();
const slot = (id, draw, cls = 'chart') => { CH.set(id, draw); return `<div class="${cls}" id="${id}" data-chart></div>`; };
function drawIn(root){
  root.querySelectorAll('[data-chart]').forEach(el => {
    const w = Math.floor(el.clientWidth), f = CH.get(el.id);
    if (w > 0 && f) f(el, w);
  });
}

/* Start of an SVG picture with a label screen readers can read out. */
const svgOpen = (w, h, label) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">`;

/* The outline of a bar with rounded top corners. */
function barPath(x, y, w, h){
  if (h <= 0.5) return '';
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`;
}

/* The point in a time-sorted list closest to minute m (a binary search). */
function nearest(pts, m){
  let lo = 0, hi = pts.length - 1;
  while (lo < hi){ const mid = (lo + hi) >> 1; if (pts[mid][0] < m) lo = mid + 1; else hi = mid; }
  return lo > 0 && Math.abs(pts[lo - 1][0] - m) < Math.abs(pts[lo][0] - m) ? lo - 1 : lo;
}

/* Round numbers for a chart's side labels, like 0, 20, 40, 60. */
function niceTicks(lo, hi, n = 4){
  if (hi - lo < 1e-9){ hi += 1; lo -= 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}

/* The little label that pops up when you point at a chart. */
const tip = $('#tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = clamp(x - tw / 2, 8, innerWidth - tw - 8);
  let top = y - th - 12; if (top < 8) top = y + 16;
  tip.style.transform = `translate(${Math.round(left)}px,${Math.round(top)}px)`;
}
function hideTip(){
  tip.hidden = true;
  document.querySelectorAll('.hovering').forEach(el => el.classList.remove('hovering'));
}

/* Calls onMove with your finger or mouse position while it is over a chart. */
function bindHover(svg, onMove){
  const h = e => { const rc = svg.getBoundingClientRect(); onMove(e.clientX - rc.left, rc, e.clientY - rc.top); };
  svg.addEventListener('pointermove', h);
  svg.addEventListener('pointerdown', h);
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
}

/* Bar chart. o.data is a list of {v: value, color, label, mk: optional "needed" mark}. */
function colChart(o){
  return (el, w) => {
    const n = o.data.length, h = o.h || 150, every = o.every || (n <= 10 ? 1 : 7);
    const padL = 32, padR = 4, padT = 22, padB = 22;
    const iw = w - padL - padR, ih = h - padT - padB;
    const band = iw / n, bw = Math.min(24, Math.max(3, band * (n > 14 ? .64 : .5)));
    const Y = v => padT + ih * (1 - clamp(v, 0, o.max) / o.max);
    let s = svgOpen(w, h, o.label);
    o.ticks.forEach(t => {
      const y = Y(t);
      s += `<line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" class="${t === 0 ? 'axis' : 'grid'}"/>`;
      s += `<text x="${padL - 7}" y="${y + 3.5}" text-anchor="end">${o.tickFmt ? o.tickFmt(t) : fNum(t)}</text>`;
    });
    const tops = [];
    o.data.forEach((d, i) => {
      const cx = padL + band * (i + .5), y = Y(d.v);
      tops.push({cx, y: d.mk != null ? Math.min(y, Y(d.mk)) : y});
      s += `<path class="bar" d="${barPath(cx - bw / 2, y, bw, padT + ih - y)}" style="fill:${d.color}"/>`;
      if (d.mk != null){ const my = Y(d.mk); s += `<line class="need" x1="${cx - bw / 2 - 3}" x2="${cx + bw / 2 + 3}" y1="${my}" y2="${my}"/>`; }
      const edge = n > 10 && i === n - 1;
      if ((n - 1 - i) % every === 0) s += `<text x="${edge ? cx + bw / 2 : cx}" y="${h - 6}" text-anchor="${edge ? 'end' : 'middle'}" class="tick${i === o.sel ? ' on' : ''}">${d.label}</text>`;
    });
    if (o.sel != null && o.valFmt){
      const t = tops[o.sel], edge = n > 10 && o.sel === n - 1;
      s += `<text x="${edge ? t.cx + bw / 2 : t.cx}" y="${t.y - 7}" text-anchor="${edge ? 'end' : 'middle'}" class="vlabel">${o.valFmt(o.data[o.sel].v)}</text>`;
    }
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, bars = svg.querySelectorAll('.bar');
    bindHover(svg, (px, rc) => {
      const i = clamp(Math.floor((px - padL) / band), 0, n - 1);
      svg.classList.add('hovering');
      bars.forEach((b, k) => b.classList.toggle('hot', k === i));
      showTip(o.tip(i), rc.left + tops[i].cx, rc.top + tops[i].y);
    });
  };
}

/* Line chart with an optional shaded band for your normal range. */
function lineChart(o){
  return (el, w) => {
    const h = o.h || 176, padL = 34, padR = 44, padT = 12, padB = 22;
    const vals = o.data.map(d => d.v), n = vals.length, every = o.every || (n <= 10 ? 1 : 7);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.band){ lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
    const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
    const iw = w - padL - padR, ih = h - padT - padB;
    const X = i => padL + (n === 1 ? iw / 2 : iw * i / (n - 1));
    const Y = v => padT + ih * (1 - (v - lo) / (hi - lo));
    const dec = ticks.length > 1 && Math.abs(ticks[1] - ticks[0]) < 1 ? 1 : 0;
    let s = svgOpen(w, h, o.label);
    if (o.band) s += `<rect class="band" x="${padL}" y="${Y(o.band[1])}" width="${iw}" height="${Math.max(0, Y(o.band[0]) - Y(o.band[1]))}" rx="4"/>`;
    ticks.forEach(t => {
      const y = Y(t);
      s += `<line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" class="grid"/>`;
      s += `<text x="${padL - 7}" y="${y + 3.5}" text-anchor="end">${(o.signed && t > 0 ? '+' : '') + fNum(t, dec)}</text>`;
    });
    const line = 'M' + vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('L');
    s += `<path d="${line}L${X(n - 1)},${padT + ih}L${X(0)},${padT + ih}Z" style="fill:${o.color};fill-opacity:.1"/>`;
    s += `<path d="${line}" class="pline" style="stroke:${o.color}"/>`;
    o.data.forEach((d, i) => { if ((n - 1 - i) % every === 0) s += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle" class="tick${i === n - 1 ? ' on' : ''}">${d.label}</text>`; });
    s += `<circle class="enddot" cx="${X(n - 1)}" cy="${Y(vals[n - 1])}" r="4.5" style="fill:${o.color}"/>`;
    s += `<text class="vlabel" x="${X(n - 1) + 9}" y="${Y(vals[n - 1]) + 4}">${o.fmt(vals[n - 1])}</text>`;
    s += `<g class="xh"><line class="xh-line" y1="${padT}" y2="${padT + ih}"/><circle class="xh-dot" r="4.5" style="fill:${o.color}"/></g>`;
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, xl = svg.querySelector('.xh-line'), xd = svg.querySelector('.xh-dot');
    bindHover(svg, (px, rc) => {
      const i = clamp(Math.round((px - padL) / (iw / Math.max(1, n - 1))), 0, n - 1);
      const x = X(i), y = Y(vals[i]);
      xl.setAttribute('x1', x); xl.setAttribute('x2', x); xd.setAttribute('cx', x); xd.setAttribute('cy', y);
      svg.classList.add('hovering');
      showTip(o.tip(i), rc.left + x, rc.top + y);
    });
  };
}

/* A tiny line chart with no labels. */
function spark(vals, h = 34){
  vals = vals.filter(fin);
  if (!vals.length) return el => { el.innerHTML = ''; };
  if (vals.length < 2) vals = [vals[0], vals[0]];
  return (el, w) => {
    const p = 7, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const X = i => p + (w - 2 * p) * i / (vals.length - 1), Y = v => p + (h - 2 * p) * (1 - (v - lo) / span);
    const line = 'M' + vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('L');
    el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line}L${X(vals.length - 1)},${h}L${X(0)},${h}Z" style="fill:var(--text-2);fill-opacity:.08"/><path d="${line}" class="pline" style="stroke:var(--text-2);stroke-width:1.75"/><circle class="enddot" cx="${X(vals.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="4" style="fill:var(--text)"/></svg>`;
  };
}

/* Sleep hypnogram: colored lanes, a stepped trace shaded by depth, and one pill per stage block. */
const LANES = ['awake', 'rem', 'light', 'deep'];
const STAGE = {awake:'Awake', rem:'REM', light:'Light', deep:'SWS (Deep)'};
const STAGE_SHORT = {awake:'Awake', rem:'REM', light:'Light', deep:'SWS'};
function hypnogram(d, o = {}){
  return (el, w) => {
    const {segs, bed, wake} = d.night;
    const padL = 46, padR = 8, padT = 4, laneH = 32, padB = 24, h = padT + laneH * 4 + padB;
    const iw = w - padL - padR, X = m => padL + iw * (m - bed) / (wake - bed);
    const Yc = st => padT + laneH * LANES.indexOf(st) + laneH / 2;
    const top = padT, bot = padT + laneH * 4, gid = 'hg-' + el.id;
    let s = svgOpen(w, h, `Sleep stages from ${clock(bed)} to ${clock(wake)}`);
    s += `<defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="0" y1="${top}" x2="0" y2="${bot}">`
      + LANES.map((l, k) => `<stop offset="${k * 25 + 4}%" style="stop-color:var(--${l})"/><stop offset="${(k + 1) * 25 - 4}%" style="stop-color:var(--${l})"/>`).join('')
      + '</linearGradient></defs>';
    LANES.forEach((l, k) => {
      s += `<rect class="lane" data-l="${l}" x="${padL}" y="${padT + laneH * k + 2}" width="${iw}" height="${laneH - 4}" rx="7" style="fill:var(--${l});fill-opacity:.07"/>`;
      s += `<text class="lanelabel" x="0" y="${Yc(l) + 4}">${STAGE_SHORT[l]}</text>`;
    });
    for (let m = Math.ceil(bed / 60) * 60; m < wake; m += 60){ const x = X(m).toFixed(1); s += `<line class="grid" x1="${x}" x2="${x}" y1="${top}" y2="${bot}"/>`; }
    let p = `M${X(segs[0].a).toFixed(1)},${Yc(segs[0].s)}H${X(segs[0].b).toFixed(1)}`;
    for (let k = 1; k < segs.length; k++) p += `V${Yc(segs[k].s)}H${X(segs[k].b).toFixed(1)}`;
    s += `<path d="${p}" class="hstep" style="stroke:url(#${gid})"/>`;
    segs.forEach(g => {
      const x = X(g.a), ww = Math.max(3, X(g.b) - x);
      s += `<rect class="seg-r" data-s="${g.s}" x="${x.toFixed(1)}" y="${Yc(g.s) - 6}" width="${ww.toFixed(1)}" height="12" rx="${Math.min(6, ww / 2).toFixed(1)}" style="fill:var(--${g.s})"/>`;
    });
    s += `<text x="${padL}" y="${h - 6}" class="tick on">${clock(bed)}</text><text x="${w - padR}" y="${h - 6}" text-anchor="end" class="tick on">${clock(wake)}</text>`;
    for (let m = Math.ceil(bed / 120) * 120; m < wake; m += 120){
      const x = X(m);
      if (x - padL > 58 && w - padR - x > 58) s += `<text x="${x}" y="${h - 6}" text-anchor="middle">${hourLabel(m)}</text>`;
    }
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, rects = svg.querySelectorAll('.seg-r');
    if (o.main) svg.classList.toggle('rest', restMode);
    if (o.focus) svg.querySelectorAll('.seg-r,.lane').forEach(r => { if ((r.dataset.s || r.dataset.l) !== o.focus) r.classList.add('dim'); });
    bindHover(svg, px => {
      const rc = svg.getBoundingClientRect();
      const m = bed + (px - padL) / iw * (wake - bed);
      let k = segs.findIndex(g => m >= g.a && m < g.b); if (k < 0) k = m < bed ? 0 : segs.length - 1;
      const g = segs[k];
      svg.classList.add('hovering');
      rects.forEach((r, j) => r.classList.toggle('hot', j === k));
      showTip(`<b>${STAGE[g.s]}</b>${clock(g.a)} to ${clock(g.b)} · ${g.b - g.a} min`, rc.left + X((g.a + g.b) / 2), rc.top + Yc(g.s) - 8);
    });
  };
}

/* Bedtime to wake time as floating pills, one per night. */
function bedChart(list){
  return (el, w) => {
    const n = list.length, h = 210, padL = 44, padR = 6, padT = 10, padB = 22;
    const beds = list.map(d => d.night.bed), wakes = list.map(d => d.night.wake);
    const lo = Math.floor(Math.min(...beds) / 60) * 60, hi = Math.ceil(Math.max(...wakes) / 60) * 60;
    const iw = w - padL - padR, ih = h - padT - padB, band = iw / n, bw = Math.min(22, band * .46);
    const Y = m => padT + ih * (m - lo) / (hi - lo);
    let s = svgOpen(w, h, 'Bedtime and wake time for each night');
    for (let m = Math.ceil(lo / 120) * 120; m <= hi; m += 120){ const y = Y(m); s += `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}"/><text x="${padL - 7}" y="${y + 3.5}" text-anchor="end">${hourLabel(m)}</text>`; }
    const ab = mean(beds), aw = mean(wakes);
    s += `<line class="ref" x1="${padL}" x2="${w - padR}" y1="${Y(ab)}" y2="${Y(ab)}"/><line class="ref" x1="${padL}" x2="${w - padR}" y1="${Y(aw)}" y2="${Y(aw)}"/>`;
    const cxs = [];
    list.forEach((d, i) => {
      const cx = padL + band * (i + .5), y1 = Y(d.night.bed), y2 = Y(d.night.wake); cxs.push(cx);
      s += `<rect class="bar" x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${y2 - y1}" rx="${bw / 2}" style="fill:var(--sleep)"/>`;
      s += `<text x="${cx}" y="${h - 6}" text-anchor="middle" class="tick${i === n - 1 ? ' on' : ''}">${DOW[d.dow]}</text>`;
    });
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, bars = svg.querySelectorAll('.bar');
    bindHover(svg, (px, rc) => {
      const i = clamp(Math.floor((px - padL) / band), 0, n - 1), d = list[i];
      svg.classList.add('hovering');
      bars.forEach((b, k) => b.classList.toggle('hot', k === i));
      showTip(`<b>${fDate(d.date)}</b>${clock(d.night.bed)} to ${clock(d.night.wake)} · ${fHM(d.sleepMin)} asleep`, rc.left + cxs[i], rc.top + Y(d.night.bed));
    });
  };
}

/* Heart rate through the day, with blue bands where workouts happened. */
function hrChart(o){
  return (el, w) => {
    const h = o.h || 190, padL = 32, padR = 10, padT = 22, padB = 22;
    const pts = o.pts.filter(p => p[0] >= o.from && p[0] <= o.to);
    if (!pts.length){ el.innerHTML = ''; return; }
    const hrs = pts.map(p => p[1]);
    const ticks = []; for (let t = 40; t <= Math.max(160, Math.ceil(Math.max(...hrs) / 40) * 40); t += 40) ticks.push(t);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const iw = w - padL - padR, ih = h - padT - padB;
    const X = m => padL + iw * (m - o.from) / (o.to - o.from), Y = v => padT + ih * (1 - (clamp(v, lo, hi) - lo) / (hi - lo));
    let s = svgOpen(w, h, o.label);
    ticks.forEach(t => { const y = Y(t); s += `<line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" class="grid"/><text x="${padL - 7}" y="${y + 3.5}" text-anchor="end">${t}</text>`; });
    (o.acts || []).forEach(a => {
      const x1 = X(Math.max(a.start, o.from)), x2 = X(Math.min(a.start + a.dur, o.to));
      if (x2 <= x1) return;
      s += `<rect class="actband" x="${x1.toFixed(1)}" y="${padT}" width="${(x2 - x1).toFixed(1)}" height="${ih}" rx="3"/>`;
      if (o.labelActs && x1 < w - 70) s += `<text class="actlabel" x="${x1.toFixed(1)}" y="${padT - 7}">${a.name}</text>`;
    });
    const line = 'M' + pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('L');
    const last = pts[pts.length - 1];
    s += `<path d="${line}L${X(last[0])},${padT + ih}L${X(pts[0][0])},${padT + ih}Z" style="fill:var(--strain);fill-opacity:.1"/>`;
    s += `<path d="${line}" class="pline" style="stroke:var(--strain);stroke-width:1.6"/>`;
    o.xticks.forEach(m => {
      const anchor = X(m) - padL < 24 ? 'start' : w - padR - X(m) < 24 ? 'end' : 'middle';
      s += `<text x="${X(m)}" y="${h - 6}" text-anchor="${anchor}">${o.xfmt(m)}</text>`;
    });
    if (o.live) s += `<circle class="enddot" cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" style="fill:var(--strain)"/>`;
    s += `<g class="xh"><line class="xh-line" y1="${padT}" y2="${padT + ih}"/><circle class="xh-dot" r="4.5" style="fill:var(--strain)"/></g>`;
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, xl = svg.querySelector('.xh-line'), xd = svg.querySelector('.xh-dot');
    bindHover(svg, (px, rc) => {
      const m = o.from + (px - padL) / iw * (o.to - o.from);
      const k = nearest(pts, m), p = pts[k];
      const x = X(p[0]), y = Y(p[1]);
      xl.setAttribute('x1', x); xl.setAttribute('x2', x); xd.setAttribute('cx', x); xd.setAttribute('cy', y);
      svg.classList.add('hovering');
      showTip(`<b>${clock(p[0])}</b>${p[1]} bpm`, rc.left + x, rc.top + y);
    });
  };
}

/* Stress through the day, colored from calm blue to high orange. */
function stressChart(d){
  return (el, w) => {
    const st = stressOf(d), h = 196, padL = 22, padR = 54, padT = 10, padB = 22;
    const from = Math.floor(st.from / 60) * 60, to = 1440;
    const iw = w - padL - padR, ih = h - padT - padB;
    const X = m => padL + iw * (m - from) / (to - from), Y = v => padT + ih * (1 - v / 3);
    const gid = 'sg-' + el.id;
    let s = svgOpen(w, h, 'Stress level through the day on a 0 to 3 scale');
    s += `<defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="0" y1="${Y(3)}" x2="0" y2="${Y(0)}"><stop offset="0" style="stop-color:var(--st-high)"/><stop offset=".5" style="stop-color:var(--st-med)"/><stop offset="1" style="stop-color:var(--st-low)"/></linearGradient></defs>`;
    [['st-low', 0, 'Low'], ['st-med', 1, 'Medium'], ['st-high', 2, 'High']].forEach(([c, v, name]) => {
      s += `<rect x="${padL}" y="${Y(v + 1)}" width="${iw}" height="${Y(v) - Y(v + 1)}" style="fill:var(--${c});fill-opacity:.07"/>`;
      s += `<text x="${w - padR + 8}" y="${(Y(v) + Y(v + 1)) / 2 + 4}" class="lanelabel">${name}</text>`;
    });
    [0, 1, 2, 3].forEach(t => { const y = Y(t); s += `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}"/><text x="${padL - 7}" y="${y + 3.5}" text-anchor="end">${t}</text>`; });
    d.acts.forEach(a => {
      const x1 = X(Math.max(a.start, from)), x2 = X(Math.min(a.start + a.dur, to));
      if (x2 > x1) s += `<rect class="actband" x="${x1.toFixed(1)}" y="${padT}" width="${(x2 - x1).toFixed(1)}" height="${ih}" rx="3"/>`;
    });
    let p = '', pen = false;
    st.series.forEach(([m, v]) => {
      if (m < from || v == null){ pen = false; return; }
      p += `${pen ? 'L' : 'M'}${X(m).toFixed(1)},${Y(v).toFixed(1)}`; pen = true;
    });
    s += `<path d="${p}" class="pline" style="stroke:url(#${gid})"/>`;
    for (let m = Math.ceil(from / 180) * 180; m <= to; m += 180){
      const x = X(m), anchor = x - padL < 20 ? 'start' : w - padR - x < 20 ? 'end' : 'middle';
      s += `<text x="${x}" y="${h - 6}" text-anchor="${anchor}">${hourLabel(m)}</text>`;
    }
    const lastPt = [...st.series].reverse().find(q => q[1] != null);
    if (d.isToday && lastPt) s += `<circle class="enddot" cx="${X(lastPt[0])}" cy="${Y(lastPt[1])}" r="4.5" style="fill:${stressLevel(lastPt[1]).c}"/>`;
    s += `<g class="xh"><line class="xh-line" y1="${padT}" y2="${padT + ih}"/><circle class="xh-dot" r="4.5" style="fill:var(--text)"/></g>`;
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, xl = svg.querySelector('.xh-line'), xd = svg.querySelector('.xh-dot');
    const pts = st.series.filter(q => q[0] >= from);
    bindHover(svg, (px, rc) => {
      const m = from + (px - padL) / iw * (to - from);
      if (!pts.length) return;
      const k = nearest(pts, m), q = pts[k];
      const x = X(q[0]);
      xl.setAttribute('x1', x); xl.setAttribute('x2', x);
      svg.classList.add('hovering');
      if (q[1] == null){
        xd.setAttribute('cy', -20);
        const inAct = d.acts.some(a => q[0] >= a.start - 4 && q[0] <= a.start + a.dur + 24);
        showTip(`<b>${clock(q[0])}</b>${inAct ? 'Workout, stress paused' : q[0] > st.to ? (d.isToday ? 'Not yet recorded' : 'Asleep') : 'Asleep'}`, rc.left + x, rc.top + padT + 20);
      } else {
        xd.setAttribute('cx', x); xd.setAttribute('cy', Y(q[1]));
        showTip(`<b>${clock(q[0])}</b>${fNum(q[1], 1)} · ${stressLevel(q[1]).label}`, rc.left + x, rc.top + Y(q[1]));
      }
    });
  };
}

/* One dot per day: the day's strain (across) against the next morning's recovery (up). */
function scatterChart(pairs){
  return (el, w) => {
    const h = 230, padL = 32, padR = 10, padT = 10, padB = 36;
    const iw = w - padL - padR, ih = h - padT - padB;
    const X = v => padL + iw * v / 21, Y = v => padT + ih * (1 - v / 100);
    let s = svgOpen(w, h, 'Day strain against next-day recovery');
    [0, 33, 67, 100].forEach(t => { const y = Y(t); s += `<line class="${t ? 'grid' : 'axis'}" x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}"/><text x="${padL - 7}" y="${y + 3.5}" text-anchor="end">${t}%</text>`; });
    [0, 7, 14, 21].forEach(t => { s += `<text x="${X(t)}" y="${h - 20}" text-anchor="${t === 0 ? 'start' : t === 21 ? 'end' : 'middle'}">${t}</text>`; });
    s += `<text x="${padL + iw / 2}" y="${h - 4}" text-anchor="middle" class="lanelabel">Day strain</text>`;
    const xs = pairs.map(p => p.x), ys = pairs.map(p => p.y), mx = mean(xs), my = mean(ys);
    const slope = xs.reduce((t, x, i) => t + (x - mx) * (ys[i] - my), 0) / (xs.reduce((t, x) => t + (x - mx) ** 2, 0) || 1);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    s += `<line class="ref" style="opacity:1" x1="${X(x0)}" x2="${X(x1)}" y1="${Y(my + slope * (x0 - mx))}" y2="${Y(my + slope * (x1 - mx))}"/>`;
    pairs.forEach(p => { s += `<circle class="dot" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" style="fill:${zone(p.y).c}"/>`; });
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, dots = svg.querySelectorAll('.dot');
    bindHover(svg, (px, rc, py) => {
      let best = -1, bd = 26 * 26;
      pairs.forEach((p, k) => { const dd = (X(p.x) - px) ** 2 + (Y(p.y) - py) ** 2; if (dd < bd){ bd = dd; best = k; } });
      if (best < 0){ hideTip(); return; }
      const p = pairs[best];
      svg.classList.add('hovering');
      dots.forEach((dt, k) => dt.classList.toggle('hot', k === best));
      showTip(`<b>${fDate(p.d.date)}</b>Strain ${fNum(p.x, 1)} the day before · Recovery ${p.y}%`, rc.left + X(p.x), rc.top + Y(p.y));
    });
  };
}

/* A ring split into colored parts, for the restorative sleep card. */
function donut(parts){
  const r = 46, c = 2 * Math.PI * r, total = parts.reduce((t, p) => t + p.v, 0), gap = 3;
  let acc = 0, s = `<svg viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="${r}" style="fill:none;stroke:var(--surface-2);stroke-width:10"/>`;
  parts.forEach(p => {
    const len = p.v / total * c;
    if (p.c) s += `<circle cx="55" cy="55" r="${r}" transform="rotate(-90 55 55)" style="fill:none;stroke:${p.c};stroke-width:10;stroke-dasharray:${Math.max(0, len - gap).toFixed(2)} ${c.toFixed(2)};stroke-dashoffset:${(-acc).toFixed(2)}"/>`;
    acc += len;
  });
  return s + '</svg>';
}

/* ==========================================================================
   Shared pieces: bits of screens that several screens use.
   Rings, rows of numbers, legends and the insight cards.
   ========================================================================== */

/* "78%" as text, or "--" when there is no number. pctHTML makes the % sign small. */
const pctText = v => fin(v) ? v + '%' : '--';
const pctHTML = v => fin(v) ? `${v}<small>%</small>` : '--';

/* Rings drawn as arcs with rounded ends.
   segs is a list of {from, to, color} between 0 and 1. ticks are white marks, like the strain target. */
function arcSVG(stroke, segs, ticks = []){
  const r = 52, c = 2 * Math.PI * r;
  let s = `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-track" cx="60" cy="60" r="${r}" style="fill:none;stroke-width:${stroke}"/>`;
  segs.forEach(g => {
    const a = clamp(fin(g.from) ? g.from : 0, 0, 1), b = clamp(fin(g.to) ? g.to : 0, 0, 1);
    if (b - a < .002) return;
    s += `<circle cx="60" cy="60" r="${r}" transform="rotate(-90 60 60)" style="fill:none;stroke:${g.color};stroke-width:${stroke};stroke-linecap:round;stroke-dasharray:${((b - a) * c).toFixed(2)} ${c.toFixed(2)};stroke-dashoffset:${(-a * c).toFixed(2)}"/>`;
  });
  ticks.forEach(f => {
    if (!fin(f)) return;
    const ang = (clamp(f, 0, 1) * 360 - 90) * Math.PI / 180, r1 = r - stroke / 2 - 1.5, r2 = r + stroke / 2 + 1.5;
    s += `<line x1="${(60 + r1 * Math.cos(ang)).toFixed(2)}" y1="${(60 + r1 * Math.sin(ang)).toFixed(2)}" x2="${(60 + r2 * Math.cos(ang)).toFixed(2)}" y2="${(60 + r2 * Math.sin(ang)).toFixed(2)}" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
  });
  return s + '</svg>';
}

/* The strain ring: a gray stretch for the target and a blue arc for strain so far. */
const strainArcs = (strain, t, stroke) => arcSVG(stroke, [{from:t.lo / 21, to:t.hi / 21, color:'#4D516C'}, {from:0, to:(strain || 0) / 21, color:'var(--strain)'}], [(t.lo + t.hi) / 42]);

/* The little up or down triangle next to a number. */
const triHTML = dl => `<span class="tri ${dl.dir} t-${dl.tone}" aria-hidden="true"></span>`;

/* A clock time without AM or PM. */
const hm12 = min => clock(min).replace(/ [AP]M$/, '');

/* ["a", "b", "c"] becomes "a, b, and c". */
const joinList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + (a.length > 2 ? ',' : '') + ' and ' + a[a.length - 1];

/* "Today", "Yesterday" or a date, for the date picker. */
function dayLabel(){
  const d = days[sel], last = days[N - 1], ago = Math.round((last.date - d.date) / 86400000);
  return d.isToday ? 'Today' : last.isToday && ago === 1 ? 'Yesterday' : fMD(d.date);
}

/* Ring battery: the real one, or 76% for the sample. */
const BATTERY = 76;
const batteryPct = () => EXT ? (fin(EXT.battery) ? EXT.battery : null) : BATTERY;

/* How many nights in a row, up to the picked day, have sleep recorded. */
function streakDays(){ let n = 0; for (let k = sel; k >= 0 && days[k].night; k--) n++; return n; }

/* How far a reading sits from the person's normal: 'up', 'down' or null when it is typical. */
function devDir(key){
  const v = M[key].get(days[sel]), b = baseline(key, sel);
  if (!fin(v) || b.cal) return null;
  const x = (v - b.mean) / (b.tol || 1);
  return x >= .45 ? 'up' : x <= -.45 ? 'down' : null;
}

/* The icon and the row name for each measurement in the lists. */
const DIC = {hrv:IC.pulse, rhr:IC.heartO, resp:IC.lungs, sleep:IC.moon, sleepHrs:IC.moon, calories:IC.flameO, steps:IC.shoe, vo2:IC.target, stress:IC.gauge, spo2:IC.drop, temp:IC.therm, strain:IC.zone, recovery:IC.pulse};
const ROWNAME = {hrv:'Heart rate variability', rhr:'Resting heart rate', resp:'Respiratory rate', sleep:'Sleep performance', sleepHrs:'Hours of sleep', calories:'Calories', steps:'Steps', vo2:'VO2 max', stress:'Stress'};

/* The data behind each bar of a daily bar chart. */
const colData = (key, list) => list.map(d => { const m = M[key], v = m.get(d); return {v, color:m.color(v), label:list.length <= 10 ? DOW[d.dow] : fMD(d.date), mk:m.marker ? m.marker(d) : null, d}; });

/* Legends for recovery zones and stress levels. */
const zoneLegend = `<span class="legend"><span class="key"><span class="sw" style="background:var(--green)"></span>67 to 100</span><span class="key"><span class="sw" style="background:var(--yellow)"></span>34 to 66</span><span class="key"><span class="sw" style="background:var(--red)"></span>0 to 33</span></span>`;
const stressLegend = `<span class="legend"><span class="key"><span class="sw" style="background:var(--st-low)"></span>Low 0 to 1</span><span class="key"><span class="sw" style="background:var(--st-med)"></span>Medium 1 to 2</span><span class="key"><span class="sw" style="background:var(--st-high)"></span>High 2 to 3</span></span>`;

/* The pop-up text for one bar of a daily chart. */
function tipFor(key, d){
  const m = M[key], v = m.get(d);
  if (key === 'recovery') return `<b>${fDate(d.date)}</b>Recovery ${v}% · ${zone(v).label}`;
  if (key === 'sleepHrs') return `<b>${fDate(d.date)}</b>Slept ${fHM(d.sleepMin)} · Needed ${fHM(d.need)}`;
  if (key === 'stress') return `<b>${fDate(d.date)}</b>Avg stress ${fNum(v, 1)} · ${stressLevel(v).label}`;
  return `<b>${fDate(d.date)}</b>${m.name} ${fmtM(key, v)}${unitSuffix(m)}`;
}

/* A bar chart of one measurement for the last `range` days. */
function dailyCols(key, range, h){
  const list = lastN(sel, range), m = M[key];
  const auto = m.max ? null : niceTicks(0, Math.max(...list.map(m.get)), 3);
  return colChart({
    label:`${m.name}, last ${range} days`, data:colData(key, list), max:m.max || auto[auto.length - 1], ticks:m.ticks || auto, tickFmt:m.tickFmt, sel:list.length - 1, h,
    valFmt:v => fin(v) ? fmtM(key, v) + (m.unit === '%' ? '%' : '') : '--', tip:i => tipFor(key, list[i])
  });
}

/* What to draw when there is nothing to chart. */
const noData = msg => el => { el.innerHTML = `<p class="note">${msg}</p>`; };

/* A line chart of a vital sign, with your normal range shaded. */
function vitalLine(key, range){
  const m = M[key], b = baseline(key, sel), list = lastN(sel, range).filter(d => fin(m.get(d)));
  if (!list.length) return noData('No readings yet. Wear your ring overnight to see this.');
  return lineChart({
    label:`${m.name}, last ${range} days`, data:list.map(d => ({v:m.get(d), label:list.length <= 10 ? DOW[d.dow] : fMD(d.date)})), color:'var(--vital)', band:b.cal ? null : [b.lo, b.hi], signed:m.signed,
    fmt:v => fmtM(key, v), tip:i => `<b>${fDate(list[i].date)}</b>${fmtM(key, m.get(list[i]))} ${m.unit}`
  });
}

/* Buttons like "7D | 30D" for picking a time range. */
const segBtns = (attr, cur, opts) => `<div class="seg" role="group" aria-label="Time range">${opts.map(([v, l]) => `<button data-${attr}="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;

/* The five vital signs on the Health screen, and which of them are outside your normal range today. */
const HM_KEYS = ['resp', 'spo2', 'temp', 'hrv', 'rhr'];
const hmOut = i => HM_KEYS.filter(k => { const v = M[k].get(days[i]), b = baseline(k, i); return fin(v) && !b.cal && (v < b.lo || v > b.hi); });

/* The big ring at the top of the Sleep, Recovery and Strain screens. */
function bigRing(svg, numHTML, label, below = ''){
  return `<div class="bigring">${svg}<div class="br-c"><p class="wordmark sm">Rhythm</p><b class="br-num">${numHTML}</b><span class="br-l">${label}</span>${below}</div></div>`;
}

/* One row in the card under the big ring: icon, name, value and an arrow vs your normal. */
function nrow(key){
  const m = M[key], v = m.get(days[sel]), dl = delta(key, sel);
  return `<button class="nrow" data-metric="${key}" aria-label="${m.name} ${fmtM(key, v)} ${m.unit}, ${dl.txt}. Open details">${DIC[key]}<span class="nl">${ROWNAME[key] || m.name}</span><span class="nv">${fmtM(key, v)}${m.unit === '%' && fin(v) ? '%' : ''}</span>${triHTML(dl)}</button>`;
}

/* The dark strip that explains the arrows. */
const vsLegend = d => `<div class="nlegend"><span class="k"><span class="tri up t-good"></span><span class="tri down t-bad"></span></span><span><b>${d.isToday ? 'Today' : fMD(d.date)}</b> vs. prior 30 days</span></div>`;

/* The insight card with the gradient edge, and an optional link that asks the coach a question. */
function gcard(text, link, q){
  return `<div class="gcard"><p>${text}</p>${link ? `<button class="glink" data-coachq="${esc(q)}">${link}${IC.arrow}</button>` : ''}</div>`;
}

/* The round X button that closes a sheet. */
const closeBtn = `<button class="icon-btn close" data-close aria-label="Close">${IC.close}</button>`;

/* ==========================================================================
   Home screen: the first screen you see.
   Three dials (Sleep, Recovery, Strain), what to do today, the health and
   stress monitors, today's activities, tonight's sleep plan and a dashboard.
   ========================================================================== */

/* The words in the insight card and the outlook sheet, based on today's recovery and strain. */
function outlookText(d){
  const z = zone(d.rec), t = targetFor(d.rec), hd = delta('hrv', sel), hrvPct = hd.txt.replace(' vs avg', '');
  let title, body;
  if (z.k === 'none' && days.slice(0, sel).some(x => x.night)){ title = 'No sleep recorded'; body = `Rhythm did not get a night from your ring for ${d.isToday ? 'last night' : fDate(d.date)}, so there is no Recovery. Wear it to bed and sync in the morning.`; }
  else if (z.k === 'none'){ title = 'Waiting for your first night'; body = 'Wear your ring to bed tonight and sync in the morning. Recovery, sleep and your strain target appear after one night and get personal after four.'; }
  else if (z.k === 'green'){ title = 'Optimal Recovery'; body = `Take advantage of your green Recovery by meeting your Strain target of ${fNum((t.lo + t.hi) / 2, 1)}. Your body is signaling it can take on significant exertion today.`; }
  else if (z.k === 'yellow'){ title = 'Maintain your fitness'; body = `Recovery is moderate at ${d.rec}%. Aim for a Strain around ${fNum((t.lo + t.hi) / 2, 1)}, save your hardest efforts for a greener day and protect tonight's sleep.`; }
  else { title = 'Prioritize rest'; body = `HRV is ${hd.dir === 'down' ? hrvPct + ' below' : 'near'} your average. Keep Strain under ${fNum(t.hi, 1)} with light movement, extra fluids and an early bedtime.`; }
  if (d.calibrating && fin(d.rec)) body += ' Scores get more personal after four nights.';
  let note;
  if (d.strain < t.lo) note = d.isToday ? `${fNum(t.lo - d.strain, 1)} more strain puts you in today's target.` : `You finished ${fNum(t.lo - d.strain, 1)} below your target.`;
  else if (d.strain <= t.hi) note = d.isToday ? 'You are in your target range. More load now adds fatigue without extra benefit.' : 'You finished inside your target range.';
  else note = d.isToday ? `You are ${fNum(d.strain - t.hi, 1)} past your target. Prioritize sleep tonight.` : `You finished ${fNum(d.strain - t.hi, 1)} above your target.`;
  return {title, body, note, t, z};
}

/* One of the three dials at the top. Tapping it opens that screen. */
const dialBtn = (go, svg, valHTML, label, aria) =>
  `<button class="dial" data-go="${go}" aria-label="${aria}"><span class="ring">${svg}<span class="ring-val"><span>${valHTML}</span></span></span><span class="dial-l">${label}${IC.chev}</span></button>`;

/* One workout tile under "Today's Activities". */

/* The rows in "My Dashboard". */
const DASH = ['hrv', 'rhr', 'resp', 'sleepHrs', 'calories', 'steps', 'vo2'];
function dashRow(key){

}

/* Builds the whole home screen. */
function renderOverview(){
  const d = days[sel], o = outlookText(d), t = o.t, z = o.z;
  const st = stressOf(d), sv = d.isToday && st.now != null ? st.now : st.avg, sl = stressLevel(sv);
  const keys = HM_KEYS.filter(k => fin(M[k].get(d))), out = hmOut(sel).filter(k => keys.includes(k));
  const pc = planCalc(d), bed = ((pc.bedAt % 1440) + 1440) % 1440;
  const bedNow = d.isToday && bed > 12 * 60 && NOW_MIN >= bed;

  const status = !EXT ? 'Sample data' : EXT.demo ? 'Demo data' : '';
  const sleepTile = !d.night ? '' : `<button class="atile" data-night aria-label="Sleep ${fHM(d.sleepMin)}, ${pctText(d.perf)} performance. Open details">

    <span class="atile-m"><b>Sleep</b><span>${clock(d.night.bed)} to ${clock(d.night.wake)}</span></span>
    <span class="atile-v">${fHM(d.sleepMin)}<small>${pctText(d.perf)}</small></span></button>`;
  const monOk = keys.length && !out.length;
  return `
  <p class="wordmark">Rhythm</p>
  ${status ? `<span class="status-pill">${status}</span>` : ''}
  <section class="dials" aria-label="Day at a glance">
    ${dialBtn('sleep', arcSVG(6.5, [{from:0, to:(d.perf || 0) / 100, color:'var(--sleep)'}]), pctHTML(d.perf), 'Sleep', `Sleep ${pctText(d.perf)}. Open Sleep`)}
    ${dialBtn('recovery', arcSVG(6.5, [{from:0, to:(d.rec || 0) / 100, color:z.c}]), pctHTML(d.rec), 'Recovery', `Recovery ${pctText(d.rec)}. Open Recovery`)}
    ${dialBtn('strain', strainArcs(d.strain, t, 6.5), fNum(d.strain, 1), 'Strain', `Strain ${fNum(d.strain, 1)}, target ${fNum(t.lo, 1)} to ${fNum(t.hi, 1)}. Open Strain`)}
  </section>

  <article class="wc insight">
    <div><h3>${o.title}</h3><p>${o.body}</p></div>
    <span class="ins-badge" aria-hidden="true">${IC.check}${fin(d.rec) ? 1 : 0}</span>
    <div class="ins-foot"><span>Strain target</span><b>${fNum(t.lo, 1)} to ${fNum(t.hi, 1)}</b></div>
  </article>

  <div class="mon2">

/* ==========================================================================
   Sleep screen: how well you slept and how to sleep better tonight.
   ========================================================================== */

/* The bedtime plan: how much sleep you need tonight and when to be in bed to wake up on time.
   Need = a 7:38 baseline + extra after a hard day + a share of recent sleep debt. */
function planCalc(d){
  const debt = lastN(d.i, 3).reduce((t, x) => t + Math.max(0, x.need - x.sleepMin), 0);
  const need = 458 + Math.round(clamp((d.strain - 10) * 3.2, 0, 35)) + Math.round(clamp(debt * .18, 0, 45));
  const goals = [['peak', 'Peak', 1], ['perform', 'Perform', .85], ['getby', 'Get by', .7]];
  const g = goals.find(x => x[0] === plan.goal) || goals[1];
  const sleep = need * g[2], inBed = sleep / .92;
  return {need, goals, g, sleep, inBed, bedAt:plan.wake - inBed};
}
function plannerHTML(){
  const d = days[sel], pc = planCalc(d);
  return `<article class="card planner">
    <div class="card-h"><h2 class="card-t">Sleep planner</h2><span class="card-note">${d.isToday ? 'Tonight' : 'The night after ' + fMD(d.date)}</span></div>
    <div class="chips" role="group" aria-label="Sleep goal">${pc.goals.map(([k, l, f]) => `<button class="chip-btn" data-goal="${k}" aria-pressed="${plan.goal === k}">${l} · ${Math.round(f * 100)}%</button>`).join('')}</div>
    <div class="plan-out">
      <div class="plan-big"><p class="eyebrow">Be in bed by</p><b>${clock(pc.bedAt)}</b></div>
      <div><p class="eyebrow">Wake at</p><div class="stepper"><button class="icon-btn" data-wake="-15" aria-label="Wake 15 minutes earlier">${IC.minus}</button><b>${clock(plan.wake)}</b><button class="icon-btn" data-wake="15" aria-label="Wake 15 minutes later">${IC.plus}</button></div></div>
    </div>
    <p class="plan-note">You need ${fHM(pc.need)} after ${d.isToday ? "today's" : "that day's"} ${fNum(d.strain, 1)} strain. This goal gets you ${fHM(pc.sleep)} of sleep with ${fHM(pc.inBed)} in bed.</p>
  </article>`;
}

/* Stage rows: time, share, 30-day average tick and the typical range underneath. Each row opens the stage guide. */
function stageRows(d){
  const n = d.night, st = stageStats(n), prev = days.slice(Math.max(0, d.i - 30), d.i).filter(x => x.night);
  const avg = {}; LANES.forEach(s => { avg[s] = prev.length ? mean(prev.map(x => x.night.tot[s])) : null; });
  const typ = s => STAGE_INFO[s].range.map(p => p / 100 * (s === 'awake' ? n.inBed : st.sleepTot));
  const scale = Math.max(...LANES.map(s => Math.max(n.tot[s], avg[s] || 0, typ(s)[1]))) * 1.08;
  return `<div class="stg">${['awake', 'light', 'deep', 'rem'].map(s => {
    const [a, b] = typ(s), x = st[s];
    return `<button class="stg-row" data-stage="${s}" aria-label="${STAGE[s]} ${fHM(x.min)}, ${Math.round(x.pct)}% ${STAGE_INFO[s].basis}. Learn more">
      <span class="stg-top"><span class="sw" style="background:var(--${s})"></span><span class="nm">${STAGE[s]}</span><b>${fHM(x.min)}</b><em>${Math.round(x.pct)}%</em><span class="chev">${IC.chev}</span></span>
      <span class="stg-bar"><span class="fill" style="width:${x.min / scale * 100}%;background:var(--${s})"></span>${avg[s] == null ? '' : `<span class="avg" style="left:${avg[s] / scale * 100}%"></span>`}</span>
      <span class="stg-typ"><span style="left:${a / scale * 100}%;width:${(b - a) / scale * 100}%"></span></span>
      <span class="stg-sub"><span>Avg ${avg[s] == null ? '--' : fHM(avg[s])}</span><span>Typical ${STAGE_INFO[s].rangeTxt}</span></span>
    </button>`;
  }).join('')}</div>`;
}

/* How each stage was spread over the first, middle and last third of the night. */
function thirdsCard(d){
  const n = d.night, st = stageStats(n), order = ['awake', 'light', 'rem', 'deep'];
  const names = ['First third', 'Middle third', 'Last third'];
  const deepEarly = Math.round(st.deep.byThird[0] / (st.deep.min || 1) * 100), remLate = Math.round(st.rem.byThird[2] / (st.rem.min || 1) * 100);
  const healthy = deepEarly >= 45 && remLate >= 35;
  return `<article class="card">
    <div class="card-h"><h2 class="card-t">When each stage happened</h2></div>
    <div class="thirds">${[0, 1, 2].map(j => `<div class="third">
      <div class="third-h"><b>${names[j]}</b><span>${clock(st.cuts[j])} to ${clock(st.cuts[j + 1])}</span></div>
      <div class="stackbar" role="img" aria-label="${names[j]}: ${order.map(s => `${STAGE[s]} ${Math.round(st[s].byThird[j])} minutes`).join(', ')}">${order.map(s => st[s].byThird[j] >= 1 ? `<span title="${STAGE[s]} ${Math.round(st[s].byThird[j])} min" style="flex:${st[s].byThird[j]};background:var(--${s})"></span>` : '').join('')}</div>
    </div>`).join('')}</div>
    <div class="legend chart-foot">${order.map(s => `<span class="key"><span class="sw" style="background:var(--${s})"></span>${STAGE_SHORT[s]}</span>`).join('')}</div>
    <p class="note chart-foot">${deepEarly}% of your deep sleep came in the first third of the night and ${remLate}% of your REM came in the last third. ${healthy ? 'That is the healthy pattern: body repair early, brain work late.' : 'Normally deep sleep is packed early and REM builds late, so an irregular bedtime may have shifted things.'}</p>
  </article>`;
}

/* A list of facts about the night: cycles, time to fall asleep, wake-ups and more. */
function detailsCard(d){
  const n = d.night, st = stageStats(n);
  const rows = [
    ['Sleep cycles', st.cycles, 'Most adults get 4 to 6'],
    ['Fell asleep in', `${n.latency} min`, 'Under 20 minutes is healthy'],
    ['First deep sleep', st.deep.first != null ? `${st.deep.first} min in` : 'None', 'Usually within 30 minutes'],
    ['First REM', st.rem.first != null ? `${st.rem.first} min in` : 'None', 'Usually 70 to 120 minutes in'],
    ['Longest deep block', `${st.deep.longest} min`, 'Longer blocks are more restorative'],
    ['Wake-ups', n.disturb, 'Brief ones are normal'],
    ['Sleep debt carried in', fHM(d.needDebt), 'Added to your sleep need'],
    ['Respiratory rate', `${fNum(d.resp, 1)} rpm`, 'Should stay steady night to night']
  ];
  return `<article class="card">
    <div class="card-h"><h2 class="card-t">Sleep details</h2><span class="card-note">${clock(n.bed)} to ${clock(n.wake)}</span></div>
    <ul class="kv">${rows.map(([k, v, h]) => `<li><span class="kv-l">${k}<em>${h}</em></span><b>${v}</b></li>`).join('')}</ul>
  </article>`;
}

/* The four parts of sleep performance, each graded Poor, Sufficient or Optimal. */
function sleepGauges(d){
  const prev = days.slice(Math.max(0, sel - 30), sel).filter(x => x.night), avg = k => fmean(prev.map(k));
  return [
    {name:'Hours vs. needed', ic:IC.moon, v:d.perf, a:avg(x => x.perf), g:grade(d.perf, 70, 85), key:'sleep'},
    {name:'Sleep consistency', ic:IC.moons, v:d.consistency, a:avg(x => x.consistency), g:grade(d.consistency, 70, 80)},
    {name:'Sleep efficiency', ic:IC.bed, v:d.eff, a:avg(x => x.eff), g:grade(d.eff, 80, 90)},
    {name:'High sleep stress', ic:IC.gauge, v:d.sleepStress, a:avg(x => x.sleepStress), g:grade(d.sleepStress, 5, 15, true)}
  ];
}
const G3 = {Poor:[0, 'var(--bad)'], Sufficient:[1, '#82869D'], Optimal:[2, 'var(--good)']};
function srow(x){
  const [gi, col] = G3[x.g.label] || [-1, ''];
  const inner = `${x.ic}<span class="nl">${x.name}</span><span class="s3" aria-hidden="true">${[0, 1, 2].map(k => `<i${k === gi ? ` style="background:${col}"` : ''}></i>`).join('')}</span><span class="nv">${fin(x.v) ? x.v + '%' : '--'}</span>`;
  return x.key ? `<button class="nrow" data-metric="${x.key}" aria-label="${x.name} ${fin(x.v) ? x.v + '%' : 'no data'}, ${x.g.label}">${inner}</button>` : `<div class="nrow" role="group" aria-label="${x.name} ${fin(x.v) ? x.v + '%' : 'no data'}, ${x.g.label}">${inner}</div>`;
}

/* The big ring and the graded list at the top of the screen. */
function sleepHero(d){
  if (!d.night) return `<section class="hero2" aria-label="No sleep recorded">${bigRing(arcSVG(8, []), '--', 'Sleep performance')}</section>
    ${gcard(`No sleep recorded for ${fDate(d.date)}. Wear your ring to bed and sync in the morning. Stages, sleep performance and your bedtime plan show up here once a night is recorded.`)}`;
  const gs = sleepGauges(d), g = sleepGrade(d.perf), gi = (G3[g.label] || [-1])[0];
  const weak = gs.filter(x => fin(x.v) && x.g.label !== 'Optimal' && x.name !== 'Hours vs. needed').sort((a, b) => (G3[a.g.label] || [3])[0] - (G3[b.g.label] || [3])[0])[0];
  const txt = `Your Sleep Performance is ${g.label.toLowerCase()}${g.label === 'Optimal' ? '' : ', but there is room to improve'}. ${weak ? `${weak.name.replace('High sleep stress', 'Sleep stress')} could use attention to help you get to optimal sleep.` : 'Every factor is in the optimal range, so keep this routine going.'}`;
  return `<section class="hero2" aria-label="Sleep performance ${pctText(d.perf)}, ${g.label}">
    ${bigRing(arcSVG(8, [{from:0, to:(d.perf || 0) / 100, color:'var(--sleep)'}]), pctHTML(d.perf), 'Sleep<br>performance', `<span class="seg3" aria-hidden="true">${[0, 1, 2].map(k => `<i class="${k === gi ? 'on' : ''}"></i>`).join('')}</span>`)}
    <div class="ncard">${gs.map(srow).join('')}<div class="nlegend"><span class="k"><i style="background:var(--bad)"></i>Poor</span><span class="k"><i style="background:#82869D"></i>Sufficient</span><span class="k"><i style="background:var(--good)"></i>Optimal</span></div></div>
  </section>
  ${gcard(txt, 'Dive into my sleep', 'Dive into my sleep from last night. What should I change?')}`;
}

/* Builds the whole Sleep screen. */

      <div class="donut">${donut([{v:tot.deep, c:'var(--deep)'}, {v:tot.rem, c:'var(--rem)'}, {v:tot.light, c:null}])}<div class="donut-c"><b>${fHM(rest)}</b><span>${Math.round(rest / d.sleepMin * 100)}% of sleep</span></div></div>
      <ul class="kv">
        <li><span><span class="sw" style="background:var(--deep)"></span>SWS (Deep)</span><b>${fHM(tot.deep)}</b></li>
        <li><span><span class="sw" style="background:var(--rem)"></span>REM</span><b>${fHM(tot.rem)}</b></li>
        <li><span>vs 30-day avg</span><b class="delta ${restCmp >= 0 ? 'good' : 'bad'}" style="font-size:13.5px">${restCmp >= 0 ? IC.up : IC.down}${fHM(Math.abs(restCmp))}</b></li>

    ${slot('sl-wk', dailyCols('sleepHrs', 7, 180))}

    <p class="note chart-foot">Lines mark your 7-night average bedtime (${clock(mean(wk.map(x => x.night.bed)))}) and wake time (${clock(mean(wk.map(x => x.night.wake)))}).</p>
  </article>

  ${plannerHTML()}

  <article class="card">
    <div class="card-h"><h2 class="card-t">What you needed</h2></div>

/* ==========================================================================
   Recovery screen: how ready your body is today, from 0 to 100%.
   ========================================================================== */

/* How many green, yellow and red days you had in the last 30, and your green streaks. */
function recMixCard(){
  const list = lastN(sel, 30).filter(x => fin(x.rec)), n = list.length;
  if (!n) return '<article class="card"><div class="card-h"><h2 class="card-t">Recovery mix</h2></div><p class="note">No recovery scores yet.</p></article>';
  const g = list.filter(x => x.rec >= 67).length, y = list.filter(x => x.rec >= 34 && x.rec < 67).length, r = n - g - y;
  const parts = [['Green', g, 'var(--green)'], ['Yellow', y, 'var(--yellow)'], ['Red', r, 'var(--red)']];
  let cur = 0; for (let k = n - 1; k >= 0 && list[k].rec >= 67; k--) cur++;
  let best = 0, run = 0; list.forEach(x => { run = x.rec >= 67 ? run + 1 : 0; best = Math.max(best, run); });
  return `<article class="card">
    <div class="card-h"><h2 class="card-t">Recovery mix</h2><span class="card-note">Last 30 days</span></div>
    <div class="stackbar" role="img" aria-label="${parts.map(([nm, c]) => `${nm} ${c} days`).join(', ')}">${parts.map(([nm, c, col]) => c ? `<span title="${nm} ${c} days" style="flex:${c};background:${col}"></span>` : '').join('')}</div>
    <ul class="kv">${parts.map(([nm, c, col]) => `<li><span><span class="sw" style="background:${col}"></span>${nm}</span><b>${c} days · ${Math.round(c / n * 100)}%</b></li>`).join('')}</ul>
    <p class="note chart-foot">${cur > 1 ? `You are on a ${cur} day green streak.` : cur === 1 ? 'You are back in the green today.' : 'You are not in the green right now.'} Your longest green streak this month was ${best} day${best === 1 ? '' : 's'}.</p>
  </article>`;
}

/* One sentence on what drove today's recovery, like "Your HRV is elevated while ... are typical". */
function recInsight(d){
  if (!fin(d.rec)) return 'No Recovery yet. Wear your ring to bed tonight and sync in the morning.';
  if (d.calibrating) return `Rhythm is still learning your normal ranges, so this Recovery of ${d.rec}% leans on typical values. It gets personal after four nights.`;
  const parts = [['hrv', 'HRV'], ['rhr', 'RHR'], ['resp', 'Respiratory Rate'], ['sleep', 'Sleep Performance']];
  const odd = [], typical = [];
  parts.forEach(([k, nm]) => { const dir = devDir(k); if (dir) odd.push(`${nm} is ${dir === 'up' ? 'elevated' : 'lower than usual'}`); else typical.push(nm); });
  const result = d.rec >= 67 ? 'a higher' : d.rec < 34 ? 'a lower' : 'a moderate';
  if (!odd.length) return `Your ${joinList(typical)} are all typical, resulting in ${result} Recovery today.`;
  return `Your ${joinList(odd)}${typical.length ? ` while your ${joinList(typical)} ${typical.length > 1 ? 'are all' : 'is'} typical` : ''}, resulting in ${result} Recovery today.`;
}

/* The big ring and the four measurements under it. */
function recoveryHero(d){

  return `<section class="hero2" aria-label="Recovery ${pctText(d.rec)}">

}

function renderRecovery(){

/* ==========================================================================
   Strain screen: how hard your heart worked today, on a 0 to 21 scale.
   ========================================================================== */

/* One workout in the activities list, and the card that holds them. */
const actRow = (a, k) => `
    <button class="act" data-act="${k}" aria-label="${a.name}, strain ${fNum(a.strain, 1)}. Open details">
      <span class="act-badge">${fNum(a.strain, 1)}</span>
      <span class="act-main"><span class="act-name">${a.name}</span><span class="act-sub">${clock(a.start)} to ${clock(a.start + a.dur)}</span></span>
      <span class="act-meta"><b>${a.dur} min</b><span>${a.avg} avg bpm</span></span>
    </button>`;
function actsCard(d){
  return `<article class="card">
    <div class="card-h"><h2 class="card-t">Activities</h2><span class="card-note">${d.acts.length} logged</span></div>
    <div class="acts">${d.acts.length ? d.acts.map(actRow).join('') : '<p class="empty">No workouts logged. Rest days count too.</p>'}</div>
  </article>`;
}

/* How many minutes of each kind of workout would take you to the middle of today's target.
   Strain grows on a curve, so the same workout adds less strain the higher you already are. */
function strainPlanCard(d){
  const t = targetFor(d.rec), mid = +((t.lo + t.hi) / 2).toFixed(1);
  const L = v => -Math.log(1 - clamp(v, 0, 20.9) / 21);
  const OPTS = [['Easy walk or ride', 'Zone 2', .0085], ['Steady run or ride', 'Zone 3', .017], ['Intervals', 'Zone 4', .028], ['Strength training', 'Weights', .009]];
  let body;
  if (!d.isToday){
    body = `<p class="sub">${d.strain < t.lo ? `You finished ${fNum(t.lo - d.strain, 1)} below that day's target.` : d.strain <= t.hi ? "You finished inside that day's target range." : `You finished ${fNum(d.strain - t.hi, 1)} above that day's target.`}</p>`;
  } else if (d.strain >= t.lo){
    body = `<p class="sub">${d.strain <= t.hi ? "You are inside today's target. More load now adds fatigue without much extra benefit, so an easy walk or mobility work is plenty." : "You are past today's target. Keep the rest of the day easy and aim for your full sleep need tonight."}</p>`;
  } else {
    const gap = L(mid) - L(d.strain);
    body = `<p class="sub">Any one of these takes you from ${fNum(d.strain, 1)} to about ${fNum(mid, 1)}, the middle of today's target.</p>
    <ul class="kv" style="margin-top:8px">${OPTS.map(([nm, z, rate]) => `<li><span class="kv-l">${nm}<em>${z}</em></span><b>${Math.max(5, Math.round(gap / rate / 5) * 5)} min</b></li>`).join('')}</ul>`;
  }
  return `<article class="card">
    <div class="card-h"><h2 class="card-t">Strain coach</h2><span class="card-note">Target ${fNum(t.lo, 1)} to ${fNum(t.hi, 1)}</span></div>
    ${body}
    <p class="note chart-foot">Estimates come from how your heart rate responds to each kind of session.</p>
  </article>`;
}

/* Minutes awake in heart rate zones 1 to 3 and in zones 4 to 5. */
function zoneSplit(d){
  const pts = hrSeries(d), up = d.night ? d.night.wake : 0, end = d.isToday ? NOW_MIN : 1440, z = zoneMinutes(pts, up, end);
  return [z[0] + z[1] + z[2], z[3] + z[4]];
}

/* A row for minutes in zones, with an arrow when it is 10% above or below your average. */
function minRow(ic, name, v, avg, aria){
  const dir = !fin(avg) || avg === 0 && v === 0 ? 'flat' : v > avg * 1.1 ? 'up' : v < avg * .9 ? 'down' : 'flat';
  const dl = {dir, tone:dir === 'flat' ? 'flat' : dir === 'up' ? 'good' : 'bad'};
  return `<div class="nrow" role="group" aria-label="${aria}">${ic}<span class="nl">${name}</span><span class="nv">${fHM(v)}</span>${triHTML(dl)}</div>`;
}

/* One sentence explaining the strain number and how it compares with the target. */
function strainInsight(d, t){
  const s = d.strain;
  const band = s < 10 ? 'Strain under 10.0 is considered light, meaning your body had an easy day and has room for more' : s < 14 ? 'Strain between 10.0 and 13.9 is considered moderate, meaning you are building fitness without overdoing it' : s < 18 ? 'Strain between 14.0 and 17.9 is considered strenuous, meaning your cardiovascular system has been working hard' : 'Strain of 18.0 and above is considered all out, meaning your body will need extra sleep and recovery';
  const tgt = s < t.lo ? `You are ${fNum(t.lo - s, 1)} below today's target of ${fNum(t.lo, 1)} to ${fNum(t.hi, 1)}.` : s <= t.hi ? "You are inside today's target." : `You are ${fNum(s - t.hi, 1)} above today's target.`;
  return `${band}. ${tgt}`;
}

/* The big ring and the rows under it. */
function strainHero(d){
  const t = targetFor(d.rec), [lo3, hi5] = zoneSplit(d);
